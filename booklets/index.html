<script>

function toast(t){const modal=$('#modal');if(modal.open){let box=$('#modalMessage');if(!box){box=document.createElement('div');box.id='modalMessage';box.className='error';box.setAttribute('role','alert');box.style.cssText='position:sticky;top:0;z-index:5;margin-bottom:12px';modal.prepend(box)}box.textContent=t;box.scrollIntoView({block:'nearest'});return}$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,6500)}

async function api(path,b,raw=false){const r=await fetch(path,b===undefined?{signal:AbortSignal.timeout(30000)}:{method:'POST',headers:{'X-Booklets':'1','Content-Type':raw?'application/pdf':'application/json'},body:raw?b:JSON.stringify(b),signal:AbortSignal.timeout(180000)});const data=await r.json();if(!r.ok)throw Error(data.error||'Verzoek mislukt');return data}

let refreshSequence=0,refreshApplied=0,overviewRefreshing=false;
async function refresh(){const seq=++refreshSequence,next=await api('/api/state');if(seq>refreshApplied){state=next;refreshApplied=seq;}}
async function refreshOverview(manual=false){if(overviewRefreshing||draft||view==='batch'||$('#modal').open||document.hidden)return;const expectedView=view,before=JSON.stringify(state);overviewRefreshing=true;try{await refresh();if(!draft&&!$('#modal').open&&view===expectedView&&before!==JSON.stringify(state)){const field=document.activeElement,id=field?.id,start=field?.selectionStart,end=field?.selectionEnd;render();if(id==='bookingSearch'){const input=$('#bookingSearch');input?.focus();input?.setSelectionRange(start,end);}}}catch(e){if(manual)toast(e.message);}finally{overviewRefreshing=false;}}
let overviewWatching=false;
function watchOverview(){if(overviewWatching)return;overviewWatching=true;setInterval(()=>refreshOverview(),5000);window.addEventListener('focus',()=>refreshOverview());document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOverview();});}

let bookletNavigationReady=false,bookletNavigationRestoring=false,bookletNavigationIndex=0,bookletNavigationRoute=null,bookletNavigationUndo=false,bookletNavigationRequest=0;
const bookletNewDrafts=new Map(),bookletDraftKeys=new WeakMap();let bookletDraftSequence=0;
function bookletBaseRoute(){if(view==='batch')return {kind:'batch',id:batchSession?.id||'',setup:batchSession?.phase==='setup'};if(draft){if(draft.id)return {kind:'object',id:draft.id,view:draft.kind==='book'?'books':'templates'};if(!bookletDraftKeys.has(draft)){const key=String(++bookletDraftSequence);bookletDraftKeys.set(draft,key);bookletNewDrafts.set(key,clone(draft));}return {kind:'new',key:bookletDraftKeys.get(draft),view};}return {kind:'view',view,...(view==='books'?{...(bookingTemplate?{template:bookingTemplate}:{}),...(bookingOlder?{older:true}:{}),...(bookingTrash?{trash:true}:{})}:{})};}
const bookletDialogFrames=new Map();let bookletDialogActive=null,bookletDialogSequence=0,bookletDialogMuted=0,bookletDialogObserver=null,bookletHistoryMaximum=0,bookletDialogEpoch=0;
function sameBookletRoute(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function validBookletDialog(frame){return !!frame&&frame.book===draft&&frame.bookingId===draft?.body.sanityBooking?.id&&sameBookletRoute(frame.base,bookletBaseRoute());}
function bookletCurrentRoute(){const base=bookletBaseRoute(),frame=bookletDialogFrames.get(bookletDialogActive);return $('#modal').open&&validBookletDialog(frame)?{...base,dialog:frame.id,step:frame.step}:base;}
function bookletDialogContext(){return {printDialog,ticketPick,documentLookup,documentPages,bookingLookup,editor,selectedField,previewPage,sharedEditor,documentTray,sanityPick,automaticWizard,routeDraft,routeOriginal,trainScreenDraft,pickerAdded,pickerPosition,exportPlan,exportIntentDigital};}
function applyBookletDialogContext(c){({printDialog,ticketPick,documentLookup,documentPages,bookingLookup,editor,selectedField,previewPage,sharedEditor,documentTray,sanityPick,automaticWizard,routeDraft,routeOriginal,trainScreenDraft,pickerAdded,pickerPosition,exportPlan,exportIntentDigital}=c);}
function mutateBookletDialog(fn){bookletDialogMuted++;try{return fn();}finally{Promise.resolve().then(()=>bookletDialogMuted--);}}
function bookletDialogDescription(modal){const routes=[['#printFields','drukwerk',printDialog],['#documentPages','documentpaginas',documentPages],['#ticketPages','ticketpaginas',ticketPick],['#ticketQuery','tickets-zoeken',ticketPick],['#documentResults','documentbronnen',documentLookup],['#slotTitle','documentinstellingen',draft?.body.sections],['#bookingNumber','boeking-kiezen',bookingLookup],['#exportVersionNote','pdf-controle',draft],['#editorFieldSelect','bouwsteen',editor],['.block-picker','bouwstenen',draft]];for(const [selector,step,actor] of routes)if(modal.querySelector(selector))return {step,actor};const heading=modal.querySelector('h2')?.textContent||'';return {step:heading==='Documenten voor deze boeking'?'documenten':'venster',actor:draft,transient:['Boekingsdocumenten ophalen','Drukwerk voorbereiden'].includes(heading)};}
function bookletDialogNavigation(frame){const modal=$('#modal');let nav=modal.querySelector('#bookletDialogNavigation');if(!nav){nav=document.createElement('div');nav.setAttribute('role','navigation');nav.id='bookletDialogNavigation';nav.className='booklet-dialog-navigation';modal.prepend(nav);}const parent=bookletDialogFrames.get(frame.parent),base=frame.base.kind==='object'||frame.base.kind==='new'?'Boekje':frame.base.view==='library'?'Bibliotheek':'Overzicht';nav.innerHTML=`<button type="button" onclick="history.back()">← ${parent?'Vorige stap':'Terug naar '+base.toLowerCase()}</button><span>${esc(base)}${parent?' › '+esc(parent.heading):''} › ${esc(frame.heading)}</span>`;}
function recordBookletDialog(){if(!bookletNavigationReady||bookletNavigationRestoring||bookletDialogMuted||batchSession?.running)return;const modal=$('#modal');if(!modal.open){if(bookletDialogActive)finishBookletDialogHistory();return;}const base=bookletBaseRoute(),heading=modal.querySelector('h2')?.textContent||'Venster',description=bookletDialogDescription(modal);let old=bookletDialogFrames.get(bookletDialogActive),parent=old?.id;if(old?.transient&&old.heading!==heading){parent=old.parent;bookletDialogFrames.delete(old.id);old=null;}let frame=old;if(!validBookletDialog(old)||old.step!==description.step||old.heading!==heading||old.actor!==description.actor){if(old&&!validBookletDialog(old))bookletDialogFrames.clear();frame={id:String(++bookletDialogSequence),base,book:draft,bookingId:draft?.body.sanityBooking?.id,step:description.step,heading,actor:description.actor,parent:validBookletDialog(old)?old.id:parent&&bookletDialogFrames.has(parent)?parent:null,transient:!!description.transient};bookletDialogFrames.set(frame.id,frame);bookletDialogActive=frame.id;modal.scrollTop=0;while(bookletDialogFrames.size>24)bookletDialogFrames.delete(bookletDialogFrames.keys().next().value);}frame.context=bookletDialogContext();frame.nodes=[...modal.childNodes];frame.scrollTop=modal.scrollTop||0;mutateBookletDialog(()=>bookletDialogNavigation(frame));frame.nodes=[...modal.childNodes];rememberBookletRoute();}
function finishBookletDialogHistory(){if(!bookletDialogActive)return;bookletDialogEpoch++;bookletDialogActive=null;bookletDialogFrames.clear();if(bookletNavigationReady&&!bookletNavigationRestoring){bookletNavigationRoute=bookletBaseRoute();history.replaceState({bookletRoute:bookletNavigationRoute,index:bookletNavigationIndex},'',bookletRouteHash(bookletNavigationRoute));}}
function initBookletDialogs(){if(typeof MutationObserver==='undefined'||bookletDialogObserver)return;const modal=$('#modal');bookletDialogObserver=new MutationObserver(()=>recordBookletDialog());bookletDialogObserver.observe(modal,{childList:true,subtree:true,attributes:true,attributeFilter:['open']});modal.addEventListener('scroll',()=>{const frame=bookletDialogFrames.get(bookletDialogActive);if(validBookletDialog(frame))frame.scrollTop=modal.scrollTop;});modal.addEventListener('cancel',event=>{event.preventDefault();closeModal();});}
function hideBookletDialogForHistory(){bookletDialogEpoch++;stopBookingAutoLoad();mutateBookletDialog(()=>$('#modal').close());bookletDialogActive=null;}
function restoreBookletDialog(route){const frame=bookletDialogFrames.get(route.dialog);if(!validBookletDialog(frame)||frame.transient)return false;bookletDialogEpoch++;stopBookingAutoLoad();applyBookletDialogContext(frame.context);bookletDialogActive=frame.id;mutateBookletDialog(()=>{const modal=$('#modal');modal.replaceChildren(...frame.nodes);if(!modal.open)modal.showModal();modal.scrollTop=frame.scrollTop;bookletDialogNavigation(frame);});return true;}
function skipBookletHistory(target){const direction=target.index<bookletNavigationIndex?-1:1;if(direction>0&&target.index>=bookletHistoryMaximum){bookletNavigationIndex=target.index;bookletNavigationRoute=bookletCurrentRoute();history.replaceState({bookletRoute:bookletNavigationRoute,index:bookletNavigationIndex},'',bookletRouteHash(bookletNavigationRoute));return;}history.go(direction);}
function bookletRouteHash(route){if(route.dialog){const {dialog,step,...base}=route;return bookletRouteHash(base)+'/stap/'+encodeURIComponent(step)+'/'+encodeURIComponent(dialog);}if(route.kind==='object')return '#boekje/'+encodeURIComponent(route.id);if(route.kind==='batch')return route.setup?'#meerdere-boekjes':'#groep/'+encodeURIComponent(route.id);if(route.kind==='new')return '#nieuw';if(route.kind==='view'&&route.view==='books')return (route.template?'#sjabloon/'+encodeURIComponent(route.template)+'/boekjes':'#boekingen')+(route.older?'/alle':'')+(route.trash?'/prullenbak':'');return '#'+({books:'boekingen',templates:'sjablonen',library:'bibliotheek',choices:'keuzepaginas'}[route.view]||'boekingen');}
function rememberBookletRoute(replace=false){if(!bookletNavigationReady||bookletNavigationRestoring||typeof history==='undefined')return;const route=bookletCurrentRoute();if(JSON.stringify(route)===JSON.stringify(bookletNavigationRoute))return;if(replace||bookletNavigationRoute?.kind==='new'&&route.kind==='object')history.replaceState({bookletRoute:route,index:bookletNavigationIndex},'',bookletRouteHash(route));else history.pushState({bookletRoute:route,index:++bookletNavigationIndex},'',bookletRouteHash(route));bookletNavigationRoute=route;bookletHistoryMaximum=Math.max(bookletHistoryMaximum,bookletNavigationIndex);}
async function restoreBookletRoute(route,request=null){stopBookingAutoLoad();cancelExportCheck();if($('#modal').open)closeModal();await refresh();if(request!==null&&request!==bookletNavigationRequest)return false;draft=null;dirty=false;if(route.kind==='object'){const item=find(route.id);if(!item||item.body.deletedAt||!['book','template'].includes(item.kind))throw Error('Dit boekje of sjabloon is niet meer beschikbaar.');draft=clone(item);view=item.kind==='book'?'books':'templates';shell();}else if(route.kind==='batch'){if(batchSession?.id===route.id){batchSession.phase=route.setup?'setup':batchSession.rows.some(r=>r.bookId)?'review':'lookup';view='batch';shell();}else if(!route.setup){await openBatchGroup(route.id,false);}else openBatchBuilder();}else if(route.kind==='new'){const saved=bookletNewDrafts.get(route.key);if(!saved)throw Error('Dit nieuwe concept is niet meer beschikbaar.');draft=clone(saved);bookletDraftKeys.set(draft,route.key);view=route.view;dirty=false;shell();}else{view=['books','templates','library','choices'].includes(route.view)?route.view:'books';if(view==='books'){bookingTemplate=typeof route.template==='string'?route.template:'';bookingOlder=route.older===true;bookingTrash=route.trash===true;}shell();}}
async function bookletHistoryChanged(event){if(!bookletNavigationReady||!event.state?.bookletRoute)return;if(bookletNavigationUndo){bookletNavigationUndo=false;return;}const target=event.state,oldIndex=bookletNavigationIndex,route=target.bookletRoute,base=bookletBaseRoute();if(batchSession?.running||quickBookRun){leave();bookletNavigationUndo=true;history.go(oldIndex-target.index);return;}if(route.dialog){if(!restoreBookletDialog(route)){skipBookletHistory(target);return;}bookletNavigationIndex=target.index;bookletNavigationRoute=route;return;}if($('#modal').open&&validBookletDialog(bookletDialogFrames.get(bookletDialogActive))&&sameBookletRoute(route,base)){hideBookletDialogForHistory();bookletNavigationIndex=target.index;bookletNavigationRoute=route;return;}if(!$('#modal').open&&sameBookletRoute(route,base)&&target.index!==oldIndex){skipBookletHistory(target);return;}if($('#modal').open&&!bookletDialogActive&&!batchSession?.running){closeModal();bookletNavigationUndo=true;history.go(oldIndex-target.index);return;}if(!leave()){bookletNavigationUndo=true;history.go(oldIndex-target.index);return;}bookletDialogFrames.clear();bookletDialogActive=null;const request=++bookletNavigationRequest;bookletNavigationRestoring=true;try{if(await restoreBookletRoute(route,request)===false||request!==bookletNavigationRequest)return;bookletNavigationIndex=target.index;bookletNavigationRoute=bookletCurrentRoute();history.replaceState({bookletRoute:bookletNavigationRoute,index:bookletNavigationIndex},'',bookletRouteHash(bookletNavigationRoute));}catch(e){if(request!==bookletNavigationRequest)return;draft=null;dirty=false;view='books';shell();bookletNavigationIndex=target.index;bookletNavigationRoute=bookletCurrentRoute();history.replaceState({bookletRoute:bookletNavigationRoute,index:bookletNavigationIndex},'',bookletRouteHash(bookletNavigationRoute));toast(e.message);}finally{if(request===bookletNavigationRequest)bookletNavigationRestoring=false;}}
async function initBookletNavigation(){if(typeof history==='undefined')return;const hash=typeof location==='undefined'?'':(location.hash||'').replace(/\/stap\/[^/]+\/\d+$/,'');let route=null;const scope=hash.match(/^#(?:sjabloon\/([a-f0-9]{32}|unlinked)\/boekjes|boekingen)(\/alle)?(\/prullenbak)?$/);if(scope)route={kind:'view',view:'books',...(scope[1]?{template:scope[1]}:{}),...(scope[2]?{older:true}:{}),...(scope[3]?{trash:true}:{})};else if(/^#(?:boekje|groep)\/[a-f0-9]{32}$/.test(hash)){const [kind,id]=hash.slice(1).split('/');route={kind:kind==='groep'?'batch':'object',id};}else if(hash==='#meerdere-boekjes')route={kind:'batch',setup:true};else{const views={'#boekingen':'books','#sjablonen':'templates','#bibliotheek':'library','#keuzepaginas':'choices'};if(views[hash])route={kind:'view',view:views[hash]};}if(route){bookletNavigationRestoring=true;try{await restoreBookletRoute(route);}catch(e){draft=null;dirty=false;view='books';shell();toast(e.message);}finally{bookletNavigationRestoring=false;}}bookletNavigationReady=true;bookletNavigationRoute=bookletCurrentRoute();history.replaceState({bookletRoute:bookletNavigationRoute,index:0},'',bookletRouteHash(bookletNavigationRoute));window.addEventListener('popstate',event=>run(()=>bookletHistoryChanged(event)));initBookletDialogs();}

function templateThumbnail(o){const first=o.body.sections?.[0],section=first?.selected||first,asset=section?.asset||find(section?.block)?.body.asset;if(!/^[a-f0-9]{32}$/.test(asset||''))return '';return `<img loading="lazy" src="/files/preview/${asset}/0" alt="Eerste pagina van ${esc(o.title)}" style="width:100%;height:140px;object-fit:contain;background:#f5f5f1">`;}

const libraryFilters={q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false};

const pickerFilters={q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false};

const pageTypes=['Route','Voorpagina','Voorwoord','Alleen tekst','Alleen foto','Foto & tekst','Inhoudsopgave','Tickets & Vouchers','Reisschema','Gemengd','Overig'];

const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function uniqueValues(values){const seen=new Set();return values.filter(v=>{v=String(v).trim();if(!v||seen.has(norm(v)))return false;seen.add(norm(v));return true}).sort((a,b)=>a.localeCompare(b,'nl'))}

function categories(b){return b.categories?.length?b.categories:[b.category||'Algemeen']}

function vocab(key){return uniqueValues(byKind('block').flatMap(o=>key==='category'?categories(o.body):key==='tag'?(o.body.tags||[]):[o.body[key]|| (key==='country'?'Algemeen':'Nog niet ingedeeld')]))}

function browserControls(pick){const f=pick?pickerFilters:libraryFilters;return `<div class="panel" style="margin:18px 0"><label>Zoeken</label><input value="${esc(f.q)}" placeholder="Naam, categorie, land of label…" oninput="setLibraryFilter(${pick},'q',this.value)"><div class="library-filter-row">${[['category','Categorie'],['country','Land'],['pageType','Type pagina'],['tag','Label'],['format','Formaat']].map(([k,label])=>`<div><label>${label}</label><select onchange="setLibraryFilter(${pick},'${k}',this.value)"><option value="">Alle</option>${vocab(k).map(v=>`<option value="${esc(v)}" ${f[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('')}</div>${pick?'':`<label class="check"><input type="checkbox" ${f.archived?'checked':''} onchange="setLibraryFilter(false,'archived',this.checked)">Ook gearchiveerde bouwstenen tonen</label>`}</div>`}

function setLibraryFilter(pick,k,v){(pick?pickerFilters:libraryFilters)[k]=v;drawLibrary(pick)}

function matchingBlocks(f){return byKind('block').filter(o=>{const b=o.body;if(b.archived&&!f.archived)return false;const cs=categories(b),tags=b.tags||[],country=b.country||'Algemeen',pt=b.pageType||'Nog niet ingedeeld';const text=norm([o.title,...cs,country,pt,...tags].join(' '));return (!f.format||b.format===f.format)&&norm(f.q).split(/\s+/).every(word=>text.includes(word))&&(!f.category||cs.some(v=>norm(v)===norm(f.category)))&&(!f.country||norm(country)===norm(f.country))&&(!f.pageType||norm(pt)===norm(f.pageType))&&(!f.tag||tags.some(v=>norm(v)===norm(f.tag)))}).sort((a,b)=>a.title.localeCompare(b.title,'nl'))}



function canonicalList(value,key){const known=vocab(key);return uniqueValues(value.split(',').map(v=>v.trim()).filter(Boolean).map(v=>known.find(x=>norm(x)===norm(v))||v))}

function metadataEditor(b){return `<label>Categorieën (gescheiden door komma’s)</label><input value="${esc(categories(b).join(', '))}" oninput="editor.body.categories=canonicalList(this.value,'category')"><select aria-label="Bestaande categorie toevoegen" onchange="addMetadata('categories',this.value);this.value='' "><option value="">Bestaande categorie toevoegen…</option>${uniqueValues(['Algemeen','Routes','Bestemming','Trein','Praktisch','Voorwoord',...vocab('category')]).map(v=>`<option>${esc(v)}</option>`).join('')}</select><label>Land</label><input list="countryChoices" value="${esc(b.country||'Algemeen')}" onchange="editor.body.country=vocab('country').find(v=>norm(v)===norm(this.value))||this.value.trim()||'Algemeen';renderEditor()"><datalist id="countryChoices">${uniqueValues(['Algemeen',...(state.countries||[]),...vocab('country')]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label>Type pagina</label><select onchange="editor.body.pageType=this.value"><option value="">Nog niet ingedeeld</option>${pageTypes.map(v=>`<option ${b.pageType===v?'selected':''}>${v}</option>`).join('')}</select><p class="muted">Voor een bouwsteen met verschillende pagina-indelingen kiest u Gemengd.</p><label>Labels (gescheiden door komma’s)</label><input value="${esc((b.tags||[]).join(', '))}" oninput="editor.body.tags=canonicalList(this.value,'tag')"><select aria-label="Bestaand label toevoegen" onchange="addMetadata('tags',this.value);this.value='' "><option value="">Bestaand label toevoegen…</option>${vocab('tag').map(v=>`<option>${esc(v)}</option>`).join('')}</select>`}

function addMetadata(key,value){if(!value)return;editor.body[key]=uniqueValues([...(key==='categories'?categories(editor.body):(editor.body.tags||[])),value]);renderEditor()}

function filterCards(q){document.querySelectorAll('[data-search]').forEach(e=>e.hidden=!e.dataset.search.includes(q.toLowerCase()))}

function newDraft(kind){if(!leave())return;draft={kind,title:'',body:{format:'A4',sections:[],values:{},duplex:true,status:'Concept',binding:'wire-o'}};dirty=true;renderDraft()}

function openDraft(id){draft=clone(find(id));dirty=clearLegacyVoucherReviews(draft.body);dirty=clearLegacyTicketNotices(draft.body)||dirty;renderDraft()}

function bookFromTemplate(source){if(source?.kind!=='template'||source.body.archived||source.body.deletedAt)throw Error('Dit sjabloon is niet meer beschikbaar voor nieuwe boekjes.');const body=clone(source.body);for(const key of ['archived','deletedAt','_googlePreparation','batchGroup'])delete body[key];body.values={};body.status='Concept';body.templateId=source.id;body.templateName=source.title;delete body.sanityBooking;clearDocumentSlots(body);for(const slot of body.sections){slot.values={};if(slot.selected)slot.selected.values={};for(const option of slot.options||[])option.values={};}return {kind:'book',title:'',body};}
function startBookFromTemplate(source){const book=bookFromTemplate(source);quickBookIntent=book;quickBookFeedback=null;stopBookingAutoLoad();cancelExportCheck();draft=book;refreshDraftBlocks();dirty=true;renderDraft();bookingSearchForm();}
function fromTemplate(id){if(!leave())return;const previous=draft;return run(async()=>{await refresh();if(draft!==previous)return;startBookFromTemplate(find(id));});}
function reuseBookTemplate(){if(draft?.kind!=='book'||!leave())return;const previous=draft;return run(async()=>{await refresh();if(draft!==previous)return;const body=previous.body,candidates=byKind('template').filter(o=>!o.body.archived&&!o.body.deletedAt),matches=body.templateId?candidates.filter(o=>o.id===body.templateId):candidates.filter(o=>body.templateName&&o.title===body.templateName);if(matches.length!==1){dirty=false;navigate('templates');toast('Het oorspronkelijke sjabloon is niet eenduidig beschikbaar. Kies een sjabloon voor de nieuwe boeking.');return;}startBookFromTemplate(matches[0]);});}
function reuseTemplateActions(){return `<button onclick="reuseBookTemplate()">Nieuwe boeking met dit sjabloon</button><button onclick="navigate('templates')">Terug naar sjablonen</button>`;}


function setTitle(v){draft.title=v;dirty=true}

function setValue(k,v){draft.body.values[k]=v;dirty=true}

function snapshot(o){return {block:o.id,revision:o.revision,title:o.title,asset:o.body.asset,pages:o.body.pages,fields:clone(o.body.fields||[]),numberingConfigured:!!o.body.numberingConfigured,tocTitle:o.body.tocTitle||'',tocHidden:!!o.body.tocHidden,tocBold:!!o.body.tocBold,todoMatch:o.body.todoMatch||'',trainScreen:o.body.trainScreen?clone(o.body.trainScreen):undefined,sanityText:o.body.sanityText?clone(o.body.sanityText):undefined,googleDoc:o.body.googleDoc?clone(o.body.googleDoc):undefined,recto:false,values:{}}}

function fieldKeys(f){if(['contents','pageNumber'].includes(f.type))return [];return f.type==='text'?[...new Set([...String(f.template||'').matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1].trim()))]:[f.key]}

function keys(){return [...new Set(activeSections().flatMap(s=>(s.fields||[]).filter(f=>f.type!=='prefilled').flatMap(fieldKeys)))]}

function pageCount(){let p=0;activeSections().forEach(s=>{if(draft.body.outputMode!=='screen'&&draft.body.duplex&&s.recto&&p%2)p++;p+=s.pages});return p}

function draftSectionCard(s,i){if(s.choice==='document')return documentSlotCard(s,i);if(s.choice)return choiceCard(s,i);let newer=find(s.block);return `<div class="section" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="dropSection(event,${i})"><img src="/files/preview/${s.asset}/0" alt=""><div class="grow"><h3>${esc(s.title)}</h3><span class="muted">${s.pages} pagina’s · ${s.oneOff?'Eenmalige PDF':'v'+(s.revision||1)}</span><label class="check"><input type="checkbox" ${s.recto?'checked':''} onchange="draft.body.sections[${i}].recto=this.checked;dirty=true;renderDraft()">Begin op rechterpagina</label>${tocBoldControl(s,i)}${tripFillerControl(s,i)}${newer&&newer.revision>s.revision?`<button class="small" onclick="updateSection(${i})">Nieuwere versie beschikbaar</button>`:''}</div><div><button class="small" aria-label="Omhoog" onclick="move(${i},-1)">↑</button><button class="small" aria-label="Omlaag" onclick="move(${i},1)">↓</button><button class="small" aria-label="Verwijderen" onclick="removeSection(${i})">×</button><br><button class="small" onclick="previewSection(${i})">Bekijk</button>${s.trainScreen&&!s.oneOff?`<button class="small" onclick="trainScreenMaker(${i})">Treinscherm persoonlijk maken</button>`:''}${s.oneOff?`<button class="small" onclick="editOneOff(${i})">${s.trainScreen?'Treinscherm bewerken':'Titel aanpassen'}</button>${s.googleDoc?`<button class="small" onclick="reviewGoogleOneOff(${i})">Pagina’s kiezen / vernieuwen</button>`:''}`:''}</div></div>`}
function sectionInsertControl(position){const previous=draft.body.sections[position-1];const label=previous?'Onderdeel invoegen na '+previous.title:'Onderdeel invoegen aan het begin';return `<div class="section-insert"><button type="button" aria-label="${esc(label)}" title="${esc(label)}" onclick="chooseSectionInsertion(${position})"><span aria-hidden="true">+</span></button></div>`}
function bookIssueEntries(overview=false){return (draft?.body.sections||[]).flatMap((s,i)=>{if(overview&&s.choice!=='document'||s.choice==='document'&&(s.omitted||documentConditionSkipped(s)))return [];const selected=s.choice?s.selected:s,message=s.issue||s.todoIssue||(selected?.reviewRequired?'Controleer de opgehaalde pagina’s en datums.':s.choice==='document'&&!selected?'Dit document is nog niet opgehaald.':'');return message?[{i,title:s.title||'Onderdeel '+(i+1),message}]:[];});}
function bookIssueSummary(overview=false){const issues=bookIssueEntries(overview);return issues.length?`<div class="error book-issue-summary" role="region" aria-label="Problemen in dit boekje"><h2>${issues.length} aandachtspunt${issues.length===1?'':'en'}</h2>${issues.map(e=>`<div class="issue-summary-row"><div><b>${esc(e.title)}</b><p>${esc(e.message)}</p></div><button onclick="goToBookIssue(${e.i},${overview})">Ga naar dit onderdeel</button></div>`).join('')}</div>`:'';}
function goToBookIssue(i,overview=false){if(!Number.isInteger(i)||!draft?.body.sections[i])return;if(!overview){closeModal();renderDraft();}const target=$('#'+(overview?'document-issue-':'draft-section-')+i);if(!target)return;target.classList.add('issue-highlight');target.focus({preventScroll:true});target.scrollIntoView({behavior:'auto',block:'center'});setTimeout(()=>target.classList.remove('issue-highlight'),2500);}

function renderDraftSections(){return sectionInsertControl(0)+(draft.body.sections.length?draft.body.sections.map((s,i)=>`<div id="draft-section-${i}" tabindex="-1">${draftSectionCard(s,i)}</div>`+sectionInsertControl(i+1)).join(''):'<div class="empty">Voeg een eerste bouwsteen, keuzepagina of boekingsdocument toe.</div>')}
function insertDraftSection(section,position=null){const sections=draft.body.sections;const index=Number.isInteger(position)?Math.max(0,Math.min(position,sections.length)):sections.length;sections.splice(index,0,section);dirty=true;return index}
function chooseSectionInsertion(position){const previous=draft.body.sections[position-1],next=draft.body.sections[position];$('#modal').innerHTML=`<div class="bar"><h2>Onderdeel invoegen</h2><button onclick="closeModal()">Annuleren</button></div><p>${previous?'Na <b>'+esc(previous.title)+'</b>':'Aan het begin'}${next?' en vóór <b>'+esc(next.title)+'</b>':''}.</p><div class="insert-options"><button onclick="chooseBlock(${position})"><b>+ Bouwsteen</b><span>Een of meer pagina’s uit de bibliotheek.</span></button><button onclick="newChoice(${position})"><b>+ Keuzepagina</b><span>Een herbruikbare keuze of een nieuwe keuzepagina.</span></button><button onclick="addDocumentSlot(${position})"><b>+ Boekingsdocument</b><span>Een plek voor bijvoorbeeld een brief, reisschema, tickets of vouchers.</span></button></div>`;$('#modal').showModal()}

function renderDraft(){if(batchSession?.running)return renderBatch();rememberBookletRoute();const isBook=draft.kind==='book';$('#main').innerHTML=`${isBook&&draft.body.batchGroup?'<div class="book-group-return">'+batchReturnButton()+'</div>':''}<div class="bar"><div><button class="small" onclick="navigate('${isBook?'books':'templates'}')">← Overzicht</button><h1 style="margin-top:12px">${isBook?'Stel het reisboekje samen':'Maak een reissjabloon'}</h1></div><div class="actions">${isBook&&draft.body.batchGroup?`<button onclick="returnToBookBatch()">Opslaan en terug naar groep</button>`:''}${isBook&&draft.id?`<button onclick="reuseBookTemplate()">Nieuwe boeking met dit sjabloon</button>`:''}<button onclick="saveAs()">Bewaar als nieuw sjabloon</button><button class="primary" onclick="saveDraft()">Opslaan</button></div></div>${isBook?quickBookResult()+bookIssueSummary():''}<div class="two"><div><div class="panel"><label>Naam ${isBook?' / boekingsnummer':''}</label><input value="${esc(draft.title)}" placeholder="Bijvoorbeeld DEMO · Voorbeeldreis" oninput="setTitle(this.value)"><div class="row"><div><label>Formaat</label><select onchange="changeFormat(this.value)"><option value="A4" ${(draft.body.format||'A4')==='A4'?'selected':''}>A4 staand</option><option value="A5" ${draft.body.format==='A5'?'selected':''}>A5 liggend</option></select><label>Uitvoer</label><select aria-label="Uitvoer" onchange="draft.body.outputMode=this.value;dirty=true;renderDraft()"><option value="print" ${draft.body.outputMode!=='screen'?'selected':''}>Drukwerk</option><option value="screen" ${draft.body.outputMode==='screen'?'selected':''}>Downloadbare PDF — geen drukwerk</option></select>${draft.body.outputMode==='screen'?'<p class="muted">Geen drukwerkvulling of blanco pagina’s voor dubbelzijdig drukken. Inhoud en tekstpassing blijven gecontroleerd.</p>':`<label>Drukuitvoering</label><select onchange="draft.body.duplex=this.value==='true';dirty=true;renderDraft()"><option value="true" ${draft.body.duplex?'selected':''}>Dubbelzijdig</option><option value="false" ${!draft.body.duplex?'selected':''}>Enkelzijdig</option></select></div><div><label>Binding (bestelafspraak)</label><select onchange="draft.body.binding=this.value;dirty=true"><option value="wire-o" ${draft.body.binding==='wire-o'?'selected':''}>Wire-o / spiraal</option><option value="other" ${draft.body.binding==='other'?'selected':''}>Andere binding: afstemmen</option></select>`}</div></div>${isBook?`<label>Werkstatus</label><select onchange="draft.body.status=this.value;dirty=true">${['Concept','Gecontroleerd','Verzonden'].map(x=>`<option ${draft.body.status===x?'selected':''}>${x}</option>`).join('')}</select>`:''}<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:10px"><h3>Inhoudsopgave en nummering</h3><p class="muted">Voeg in de bibliotheek een inhoudsopgaveveld en paginanummers toe op de gewenste pagina’s. Positie en lettertype stelt u daar per veld in.</p>${draft.body.contents||draft.body.pageNumbers?`<div class="notice">Dit boekje gebruikt nog de eerdere automatische instellingen.<button type="button" onclick="draft.body.contents=false;draft.body.pageNumbers=false;dirty=true;renderDraft()">Gebruik uitsluitend velden uit de bouwstenen</button></div>`:''}<p class="muted">De eerste PDF-pagina telt als 1. Inhoudsopgave en blanco’s tellen mee; toegevoegde blanco’s krijgen geen zichtbaar nummer. De inhoudsopgave verwijst naar deze PDF-paginanummers.</p></div><p class="muted">${draft.body.format==='A5'?'A5 liggend':'A4 staand'} · ${pageCount()} PDF-pagina’s${draft.body.outputMode!=='screen'&&draft.body.duplex?' inclusief eventuele blanco’s':''}. ${draft.body.contents?'Dit is vóór invoegen van de inhoudsopgave; het definitieve aantal staat bij de export. ':''}${draft.body.outputMode==='screen'?'Downloadbare PDF zonder drukwerkeisen.':'Omslag en bindmarge eerst afstemmen met de drukker.'}</p></div><div style="margin:18px 0" class="bar"><h2 style="margin:0">Hoofdstukken</h2><div class="actions"><button onclick="chooseBlock()">+ Bouwsteen</button><button onclick="newChoice()">+ Keuzepagina</button><button onclick="addDocumentSlot()">+ Boekingsdocument</button>${isBook?`<button onclick="openDocumentTray()">Documenten wijzigen</button><button onclick="trainScreenMaker()">+ Treinscherm</button><button onclick="mailTicketImport()">+ Tickets uit e-mail</button><button onclick="addOneOff(false)">+ Eenmalige PDF</button><button onclick="addOneOff(true)">+ Reisschema toevoegen</button><button onclick="googleImport(true)">+ Google-reisschema</button>`:''}</div></div><p class="muted">Sleep een hoofdstuk of gebruik de pijlen. Alle pagina’s blijven samen.</p>${renderDraftSections()}</div><div><div class="panel"><h2>${isBook?'Persoonlijke gegevens':'Velden in dit sjabloon'}</h2>${isBook?sanityBookingPanel():'<p class="muted">Klantvelden: {{klantvoornaam}}, {{klantachternaam}}, {{vertrekdatum}}, {{terugkomstdatum}}, {{reisnaam}} en {{boekingsnummer}}.</p>'}<p class="muted">${isBook?'Deze gegevens gelden in het hele boekje. Afwijkingen per hoofdstuk stelt u in via Bekijk.':'Bij het maken van een boeking worden deze gegevens ingevuld.'}</p>${prefilledEditors()}${keys().map(k=>`<label>${esc(k)}</label><textarea rows="2" ${!isBook?'disabled':''} oninput="setValue('${k}',this.value)">${esc(draft.body.values[k]||'')}</textarea>`).join('')||(prefilledEditors()?'':'<p>Nog geen invulvelden. Stel velden in bij een bouwsteen in de bibliotheek.</p>')}</div>${isBook?`<div class="panel" style="margin-top:20px"><h2>${draft.body.outputMode==='screen'?'Downloadbare PDF':'Drukbestand'}</h2><button class="small" onclick="exportStorageSettings()">PDF-opslag in Drive</button><p>Bij het maken van de PDF worden de nieuwste bouwsteenversies gebruikt, ook binnen keuzepagina’s. Uw ingevulde teksten blijven behouden. Eerdere PDF’s blijven bewaard.</p><div class="actions"><button class="primary" onclick="exportBook(this)">Controleren & PDF maken</button><button onclick="exportBook(th function tocBoldValue(s){return !!(s.choice&&s.choice!=='document'&&!s.tocBoldOverride?s.selected?.tocBold:s.tocBold);}
function tocBoldControl(s,i){return `<label class="check"><input type="checkbox" ${tocBoldValue(s)?'checked':''} onchange="setSectionTocBold(${i},this.checked)">Vetgedrukt in inhoudsopgave</label>`;}
function setSectionTocBold(i,enabled){const s=draft.body.sections[i];s.tocBold=!!enabled;s.tocBoldOverride=true;if(s.choice==='document'&&s.selected)applyDocumentSettings(s,s.selected);dirty=true;renderDraft();}
function move(i,d){let n=i+d;if(n<0||n>=draft.body.sections.length)return;[draft.body.sections[i],draft.body.sections[n]]=[draft.body.sections[n],draft.body.sections[i]];dirty=true;renderDraft()}

function dropSection(e,n){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(i)||i<0||i>=draft.body.sections.length)return;let s=draft.body.sections.splice(i,1)[0];draft.body.sections.splice(n,0,s);dirty=true;renderDraft()}

function removeSection(i){draft.body.sections.splice(i,1);dirty=true;renderDraft()}

function updateSection(i){if(!confirm('Dit hoofdstuk vervangen door de nieuwste bibliotheekversie? Controleer daarna de velden.'))return;let s=draft.body.sections[i];draft.body.sections[i]={...snapshot(find(s.block)),recto:s.recto,values:s.values,...tripFillerProperties(s),...(s.tocBoldOverride?{tocBold:s.tocBold,tocBoldOverride:true}:{})};dirty=true;renderDraft()}

function resetPicker(){Object.assign(pickerFilters,{q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false});const panel=$('#modal .block-picker .panel');panel.outerHTML=browserControls(true);drawLibrary(true)}



function closeModal(){if(quickBookRun)quickBookRun.cancelled=true;quickBookIntent=null;printDialog=null;finishBookletDialogHistory();cancelExportCheck();stopBookingAutoLoad();if(googlePagePick){googlePagePick.resolve(null);googlePagePick=null;}$('#modal').close()}

async function persistDraft(){const r=await api('/api/save',draft);draft.id=r.id;draft.revision=r.revision;dirty=false;await refresh();return r}

function saveAs(){run(async()=>{const title=prompt('Naam voor het nieuwe reissjabloon',draft.title);if(!title)return;const b=clone(draft.body);if(b.sections.some(s=>s.oneOff)){if(!confirm('Eenmalige PDF’s zijn alleen voor deze boeking en worden niet in het sjabloon opgenomen. Doorgaan?'))return;b.sections=b.sections.filter(s=>!s.oneOff)}b.values={};delete b.sanityBooking;delete b.batchGroup;clearDocumentSlots(b);b.sections.forEach(s=>s.values={});await api('/api/save',{kind:'template',title,body:b});await refresh();toast('Nieuw reissjabloon opgeslagen')})}

function previewSection(i){let s=draft.body.sections[i];s=s.choice?s.selected:s;if(!s)return;$('#modal').innerHTML=`<div class="bar"><h2>${esc(s.title)}</h2><button onclick="closeModal()">Sluiten</button></div><div class="two"><div style="max-height:70vh;overflow:auto">${Array.from({length:s.pages},(_,n)=>`<img style="width:100%;margin-bottom:15px;border:1px solid #ddd" src="/files/preview/${s.asset}/${n}" alt="Pagina ${n+1}">`).join('')}</div><div><p class="muted">Bronvoorbeeld zonder personalisatie. De gemaakte druk-PDF toont het eindresultaat.</p><h3>Afwijkende gegevens voor dit hoofdstuk</h3><p class="muted">Laat leeg om het algemene boekingsveld te gebruiken.</p>${[...new Set(s.fields.filter(f=>f.type!=='prefilled').flatMap(fieldKeys))].map(k=>`<label>${esc(k)}</label><input value="${esc(s.values?.[k]||'')}" oninput="sectionValue(${i},'${k}',this.value)">`).join('')}</div></div>`;$('#modal').showModal()}

function sectionValue(i,k,v){let s=draft.body.sections[i];s=s.choice?s.selected:s;s.values??={};if(v)s.values[k]=v;else delete s.values[k];dirty=true}

const editorTabs=[['basis','Basis'],['tekst','Tekst & velden'],['pagina','Pagina'],['opmaak','Opmaak']],editorTabStates=new WeakMap();

function editorPanelStart(key,active){return `<section id="editor-panel-${key}" role="tabpanel" aria-labelledby="editor-tab-${key}" tabindex="0" ${key===active?'':'hidden'}>`;}
function editorTabBar(active){return `<div class="block-editor-tabbar" role="tablist" aria-label="Bouwsteeninstellingen" onkeydown="editorTabKey(event)">${editorTabs.map(([key,title])=>`<button type="button" role="tab" id="editor-tab-${key}" data-editor-tab="${key}" aria-controls="editor-panel-${key}" aria-selected="${key===active}" tabindex="${key===active?0:-1}" onclick="setEditorTab('${key}')">${esc(title)}</button>`).join('')}</div>`;}
function setEditorTab(key,focus=false){if(!editor||!editorTabs.some(t=>t[0]===key))return;editorTabStates.set(editor,key);for(const tab of document.querySelectorAll?.('#modal [data-editor-tab]')||[]){const chosen=tab.dataset.editorTab===key;tab.setAttribute('aria-selected',String(chosen));tab.tabIndex=chosen?0:-1;}for(const [name] of editorTabs){const panel=$('#editor-panel-'+name);if(panel)panel.hidden=name!==key;}const panel=$('#modal')?.querySelector?.('.fields');if(panel)panel.scrollTop=0;if(focus)$('#editor-tab-'+key)?.focus();}
function editorTabKey(event){const index=editorTabs.findIndex(t=>t[0]===event.target.dataset.editorTab);if(index<0)return;const next=event.key==='ArrowRight'?(index+1)%4:event.key==='ArrowLeft'?(index+3)%4:event.key==='Home'?0:event.key==='End'?3:-1;if(next>=0){event.preventDefault();setEditorTab(editorTabs[next][0],true);}}
function selectEditorField(index,tab=null){if(index!==-1&&!editor.body.fields[index])return;selectedField=index;if(index>=0)previewPage=editor.body.fields[index].page;if(tab)editorTabStates.set(editor,tab);renderEditor();}

function renderEditorContent(){fitRun++;let e=editor;let f=e.body.fields[selectedField];const active=editorTab();$('#modal').innerHTML=`<div class="block-editor-frame"><div class="bar block-editor-header"><h2>Bouwsteen beheren</h2><div class="actions"><button onclick="closeModal()">Sluiten</button><button class="primary" onclick="saveBlock()">Opslaan</button></div></div><div class="two block-editor-layout"><div class="block-editor-preview"><div class="bar"><span>Voorbeeldpagina</span><select style="width:140px" onchange="previewPage=Number(this.value);selectedField=-1;renderEditor()">${Array.from({length:e.body.pages},(_,n)=>`<option value="${n}" ${n===previewPage?'selected':''}>${n+1} / ${e.body.pages}</option>`).join('')}</select></div><p class="muted">${e.body.sanityText?'Bewerk de inhoud in Sanity. Paginanummers stelt u rechts per pagina in.':e.body.googleDoc?'Bewerk de inhoud in Google Docs. Paginanummers stelt u rechts per pagina in.':'Klik op een tekstvak om het te bewerken of op een lege plek om een veld te plaatsen. Posities zijn percentages vanaf linksboven.'}</p><div class="preview" onclick="placeField(event)"><img src="/files/preview/${e.body.asset}/${previewPage}" alt="Voorbeeldpagina">${e.body.fields.map((f,i)=>f.page===previewPage?`${f.type==='pageNumber'?'':`<div class="field-backdrop" data-field="${i}" style="${fieldBackdropStyle(f)}"></div>`}<div class="fieldbox ${i===selectedField?'selected':''}" style="${f.type==='pageNumber'?numberBadgeStyle(f):fieldPreviewStyle(f)}">${f.type==='pageNumber'?'88':esc(fieldPreviewLabel(f))}</div>`:'').join('')}</div></div><div class="fields block-editor-controls">${editorTabBar(active)}${editorPanelStart('basis',active)}<label>Naam</label><input value="${esc(e.title)}" oninput="editor.title=this.value;showDuplicateTitle()"><div id="duplicateTitleWarning" role="status"></div><label>Titel voor inhoudsopgave</label><input value="${esc(e.body.tocTitle||'')}" placeholder="Leeg = naam van de bouwsteen" maxlength="300" oninput="editor.body.tocTitle=this.value"><label class="check"><input type="checkbox" ${e.body.tocHidden?'checked':''} onchange="editor.body.tocHidden=this.checked">Verbergen in inhoudsopgave</label><label class="check"><input id="blockTocBold" type="checkbox" ${e.body.tocBold?'checked':''} onchange="editor.body.tocBold=this.checked">Vetgedrukt in inhoudsopgave</label>${metadataEditor(e.body)}${extraMetadata(e.body)}${autoMetadataControls(e.body,'block')}<label for="blockTodoMatch">Herkennen in Sanity-ToDo (optioneel)</label><input id="blockTodoMatch" maxlength="300" value="${esc(e.body.todoMatch||'')}" placeholder="Bijvoorbeeld Premier inn Wien" oninput="editor.body.todoMatch=this.value"><p class="muted">De volledige tekst moet binnen één ToDo voorkomen. Extra tekst mag; hoofdletters en extra spaties maken geen verschil. Voor routes wordt dit gebruikt bij routekeuzes.</p><label>Inhoud gecontroleerd op</label><input type="date" value="${esc(e.body.checked)}" oninput="editor.body.checked=this.value"><label class="check"><input type="checkbox" ${e.body.archived?'checked':''} onchange="editor.body.archived=this.checked">Archiveren voor nieuwe boekjes</label>${e.body.sanityText?sanitySourcePanel(e.body):e.body.trainScreen?`<div class="notice"><b>Gemaakt met Treinscherm</b><button onclick="trainScreenMaker(null,true)">Treinscherm bewerken</button></div>`:e.body.routeMaker?routeSourcePanel(e.body):e.body.googleDoc?googleSourcePanel(e.body):'<button onclick="replacePdf()">Nieuwe PDF-versie uploaden</button>'}<p class="muted">Bij opnieuw genereren gebruiken boekjes de nieuwste bouwsteenversie. Bij vervangen worden invulvelden opnieuw ingesteld.</p></section>${editorPanelStart('tekst',active)}<h3>Invulvelden en tekstblokken</h3><button type="button" onclick="addPhotoForewordField()">+ Voorwoord met foto: twee kolommen</button><select id="editorFieldSelect" onchange="selectEditorField(Number(this.value))"><option value="-1">Selecteer een veld</option>${e.body.fields.map((f,i)=>`<option value="${i}" ${i===selectedField?'selected':''}>${esc(f.key)} · p${f.page+1}</option>`).join('')}</select>${f?`<label>Soort</label><select id="editorFieldType" onchange="fieldType(this.value)"><option value="field" ${!f.type||f.type==='field'?'selected':''}>Los invulveld</option><option value="text" ${f.type==='text'?'selected':''}>Persoonlijk tekstblok</option><option value="prefilled" ${f.type==='prefilled'?'selected':''}>Vooraf ingevulde tekst (wijzigbaar)</option><option value="contents" ${f.type==='contents'?'selected':''}>Inhoudsopgave</option><option value="pageNumber" ${f.type==='pageNumber'?'selected':''}>Paginanummer</option></select><label>${f.type==='text'?'Naam van dit tekstblok':'Veldnaam (bijv. reizigersnamen)'}</label><input value="${esc(f.key)}" oninput="fieldSet('key',this.value)">${['text','prefilled'].includes(f.type)?`<label>Standaardtekst / tekst met invulcodes</label><div class="actions" style="margin:8px 0"><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('bold')"><b>Vet</b></button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('italic')"><i>Cursief</i></button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('heading')">Kopje</button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('bullet')">Opsomming</button></div><textarea id="blockText" rows="8" oninput="fieldSet('template',this.value)" placeholder="Beste {{aanhefnaam}},



Uw reis naar {{bestemming}} begint op {{vertrekdatum}}.">${esc(f.template||'')}</textarea><p class="muted">Gebruik {{veldnaam}} voor persoonlijke gegevens. Enter begint een nieuwe regel; een lege regel scheidt alinea’s. Regels worden automatisch afgebroken binnen de breedte. Opmaak wordt in de PDF toegepast: **vet**, *cursief* en # Kopje op een eigen regel. Selecteer tekst en gebruik de knoppen.</p><div id="detectedKeys" class="muted">Gevraagde gegevens: ${fieldKeys(f).map(esc).join(', ')||'geen'}</div>`:''}<label class="check"><input type="checkbox" ${f.required?'checked':''} oninput="fieldSet('required',this.checked)">Verplicht invullen</label><button onclick="editor.body.fields.splice(selectedField,1);selectedField=-1;renderEditor()">Veld verwijderen</button><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:12px"><h3>Tekstpassing controleren</h3><p class="muted">Controle met dezelfde lettergrootte, opmaak en regelafstand als de PDF. Vul voorbeeldgegevens in; langere klantgegevens kunnen later meer ruimte vragen.</p>${fieldKeys(f).map(k=>`<label>Voorbeeld: ${esc(k)}</label><input value="${esc(fitExamples[k]||'')}" placeholder="Voorbeeldwaarde" data-fit-key="${esc(k)}" oninput="fitExamples[this.dataset.fitKey]=this.value;invalidateFit()">`).join('')}<button type="button" style="margin-top:12px" onclick="checkFit()">Controleer tekstpassing</button></div>`:'<p class="muted">Klik op een lege plek in het ontwerp om een veld toe te voegen. Kies daarna ‘Persoonlijk tekstblok’ voor een volledige alinea met invulcodes.</p>'}<div id="fitResult" role="status" aria-live="polite" style="margin-top:12px"></div></section>${editorPanelStart('pagina',active)}${pageLayoutControls()}<h3>Deze pagina · ${previewPage+1}</h3><label class="check"><input type="checkbox" ${e.body.fields.some(x=>x.page===previewPage&&x.type==='pageNumber')?'checked':''} onchange="togglePageNumber(this.checked)">Paginanummer op deze pagina</label><button type="button" onclick="resetNumberDefaults()">Nummering deze pagina: nieuwe standaard</button><button type="button" onclick="addContentsField()">+ Inhoudsopgaveveld</button><button type="button" onclick="recommendedContentsStyle()">Inhoudsopgave: aanbevolen stijl</button><p class="muted">Paginanummer: zwart blokje 9 × 7 mm, witte cijfers in Open Sans vet 10 pt. Het blokje wordt gecentreerd rond de nummerpositie. Selecteer het veld om de positie te wijzigen. De nummerstijl staat vast. De inhoudsopgave wordt gevuld bij het maken van het boekje.</p></section>${editorPanelStart('opmaak',active)}${f?`<p class="muted">Geselecteerd veld: <b>${esc(f.key)}</b> · pagina ${f.page+1}</p><button type="button" class="small" onclick="setEditorTab('tekst')">Tekst &amp; veld wijzigen</button>${['text','prefilled'].includes(f.type)?textFlowSettings(f):''}<div class="row">${['x','y','w','h'].map((k,i)=>`<div><label>${['Links %','Boven %','Breedte %','Hoogte %'][i]}</label><input type="number" step="0.1" value="${f[k]}" oninput="fieldSet('${k}',Number(this.value))"></div>`).join('')}${!['contents','pageNumber'].includes(f.type)?`<div><label>Uitlijning</label><select id="fieldAlignment" ${f.backgroundColor&&f.backgroundFullWidth&&f.centerFullWidth?'disabled':''} onchange="fieldSet('align',this.value)">${[['left','Links'],['center','Gecentreerd'],['right','Rechts']].map(([v,t])=>`<option value="${v}" ${(f.align||'left')===v?'selected':''}>${t}</option>`).join('')}</select><p class="muted">${f.backgroundColor&&f.backgroundFullWidth&&f.centerFullWidth?'Tekstcentrering gebruikt de volledige paginabreedte.':'Binnen de breedte van dit tekstvak.'}</p></div>`:''}<div><label>Lettertype</label><select ${f.type==='pageNumber'?'disabled':''} onchange="fieldSet('font',this.value)">${['Open Sans','Montserrat'].map(name=>`<option ${ (f.type==='pageNumber'?'Open Sans':f.font||'Open Sans')===name?'selected':''}>${name}</option>`).join('')}</select></div><div><label>Lettergrootte (pt)</label><input type="number" min="6" max="72" step="0.5" value="${f.type==='pageNumber'?10:f.size||11}" ${f.type==='pageNumber'?'disabled':''} oninput="fieldSet('size',Number(this.value))"></div><div><label>Kleur</label><input type="color" ${f.type==='pageNumber'?'disabled':''} value="${f.type==='pageNumber'?'#ffffff':f.color}" oninput="fieldSet('color',this.value)"></div></div>${fieldAutoFitControls(f)}${f.type==='pageNumber'?'':`<label class="check"><input type="checkbox" ${f.backgroundColor?'checked':''} onchange="fieldSet('backgroundColor',this.checked?'#000000':null);renderEditor()">Achtergrond achter tekst</label>${f.backgroundColor?`<div class="row"><div><label>Achtergrondkleur</label><input type="color" value="${f.backgroundColor}" oninput="fieldSet('backgroundColor',this.value)"></div><div><label>Dekking: <span id="backgroundPercent">${Math.round((f.backgroundOpacity??.5)*100)}</span>%</label><input type="range" min="0" max="100" value="${Math.round((f.backgroundOpacity??.5)*100)}" oninput="fieldSet('backgroundOpacity',Number(this.value)/100)"></div></div><label class="check"><input type="checkbox" ${f.backgroundFullWidth?'checked':''} onchange="fieldSet('backgroundFullWidth',this.checked);renderEditor()">Achtergrond over de volle paginabreedte</label>${f.backgroundFullWidth&&!['contents','pageNumber'].includes(f.type)?`<label class="check"><input id="centerFullWidth" type="checkbox" ${f.centerFullWidth?'checked':''} onchange="fieldSet('centerFullWidth',this.checked);renderEditor()">Tekst centreren over de volle paginabreedte</label>`:''}<p class="muted">Met tekstcentrering staat de tekst in het midden van de pagina; anders houdt de tekst zijn positie. De achtergrond gebruikt de hoogte van het tekstveld. Kies bijvoorbeeld witte tekst op zwart met 50% dekking.</p>`:''}`}<p class="muted">Standaard Open Sans 11 pt. Lettertype en grootte zijn aanpasbaar. Regelafstand ${Math.round((f.lineSpacing??1.5)*100)}%; lettertype ingesloten in de PDF.</p>`:'<p class="muted">Kies eerst een veld bij Tekst &amp; velden of klik op een tekstvak in het voorbeeld.</p><button type="button" onclick="setEditorTab(\'tekst\')">Veld kiezen</button>'}</section></div></div></div>`}

function togglePageNumber(enabled){editor.body.numberingConfigured=true;if(enabled){editor.body.fields.push({key:'Paginanummer',type:'pageNumber',page:previewPage,...numberDefaults(),font:'Open Sans',color:'#183c3c',required:false});selectedField=editor.body.fields.length-1}else{editor.body.fields=editor.body.fields.filter(f=>!(f.page===previewPage&&f.type==='pageNumber'));selectedField=-1}renderEditor()}

function recommendedContentsStyle(){for(const f of editor.body.fields||[])if(f.type==='contents')Object.assign(f,{font:'Open Sans',size:10.5,color:'#1A1A1A'});renderEditor();}
function fieldAutoFitControls(f){if(['contents','pageNumber'].includes(f.type))return '';return `<label class="check"><input id="fieldAutoFit" type="checkbox" ${f.autoFit?'checked':''} onchange="setFieldAutoFit(this.checked)">Lettertype verkleinen als de tekst niet past</label>${f.autoFit?`<label for="fieldMinSize">Minimale lettergrootte (pt)</label><input id="fieldMinSize" type="number" min="6" max="${f.size||11}" step="0.25" value="${f.minSize??Math.min(8,f.size||11)}" oninput="fieldSet('minSize',Number(this.value))">`:''}<p class="muted">Gebruikt bij elke PDF de werkelijk ingevulde tekst. Verkleint alleen als dat nodig is, tot de ingestelde minimumgrootte. Als het dan nog niet past, blijft de controle dit melden.</p>`;}
function setFieldAutoFit(enabled){const f=editor.body.fields[selectedField];if(!f||['contents','pageNumber'].includes(f.type))return;f.autoFit=enabled;if(enabled)f.minSize=Math.min(f.minSize??8,f.size||11);invalidateFit();renderEditor();}

function textFlowSettings(f){return `<div class="row"><div><label for="fieldColumns">Kolommen</label><select id="fieldColumns" onchange="setTextColumns(Number(this.value))"><option value="1" ${(f.columns||1)===1?'selected':''}>Eén kolom</option><option value="2" ${f.columns===2?'selected':''}>Twee kolommen: links naar rechts</option></select></div><div><label for="fieldLineSpacing">Regelafstand</label><input id="fieldLineSpacing" type="number" min="1" max="3" step="0.05" value="${f.lineSpacing??1.5}" oninput="fieldSet('lineSpacing',Number(this.value))"></div>${f.columns===2?`<div><label for="fieldColumnGap">Ruimte tussen kolommen (mm)</label><input id="fieldColumnGap" type="number" min="0" max="30" step="0.5" value="${f.columnGapMm??8}" oninput="fieldSet('columnGapMm',Number(this.value))"></div>`:''}</div><p class="muted">${f.columns===2?'De tekst vult eerst de linker kolom en loopt daarna door in de rechter, ook midden in een alinea. Beide gebruiken dezelfde hoogte.':'Tekst loopt door binnen één tekstvlak.'} Tekst die niet past geeft een melding bij de controle; er wordt niets afgekapt.</p>`;}
function setTextColumns(count){const f=editor.body.fields[selectedField];f.columns=count;if(count===2){f.columnGapMm??=8;f.lineSpacing??=1.65;}renderEditor();}
function fieldPreviewLabel(f){return f.key+(f.columns===2?' · links → rechts':'');}
function addPhotoForewordField(){if(editor.body.googleDoc||editor.body.sanityText){toast('Gebruik hiervoor een vaste PDF met foto en titel.');return;}if(editor.body.format!=='A4'){toast('Deze voorwoordinstelling is bedoeld voor A4 staand.');return;}const m=editor.body.meta?.[previewPage]||{width:595.276,height:841.89},width=m.rotation%180?m.height:m.width,height=m.rotation%180?m.width:m.height,margin=25*72/25.4;editor.body.fields.push({key:'Voorwoord',type:'text',page:previewPage,x:margin/width*100,y:52,w:(width-2*margin)/width*100,h:48-margin/height*100,size:10,font:'Open Sans',color:'#000000',align:'left',columns:2,columnGapMm:8,lineSpacing:1.65,required:true,template:'Beste {{klantvoornaam}} {{klantachternaam}},\n\n{{voorwoord}}'});selectedField=editor.body.fields.length-1;editorTabStates.set(editor,'tekst');renderEditor();}
function addContentsField(){if(editor.body.googleDoc||editor.body.sanityText){toast('Gebruik een vaste PDF voor de inhoudsopgave.');return;}editor.body.fields.push({key:'Inhoudsopgave',type:'contents',page:previewPage,x:10,y:20,w:80,h:65,size:10.5,font:'Open Sans',color:'#1A1A1A',required:false});selectedField=editor.body.fields.length-1;renderEditor()}

function placeField(ev){const bounds=ev.currentTarget.getBoundingClientRect(),px=(ev.clientX-bounds.left)/bounds.width*100,py=(ev.clientY-bounds.top)/bounds.height*100;const existing=editor.body.fields.map((field,index)=>({field,index})).reverse().find(({field:f})=>f.page===previewPage&&px>=(f.backgroundColor&&f.backgroundFullWidth&&f.centerFullWidth?0:f.x)&&px<=(f.backgroundColor&&f.backgroundFullWidth&&f.centerFullWidth?100:f.x+f.w)&&py>=f.y&&py<=f.y+f.h);if(existing){selectEditorField(existing.index,'tekst');return;}if(editor.body.googleDoc||editor.body.sanityText){toast('Bewerk tekst in de gekoppelde bron. Paginanummers kunt u hieronder instellen.');return;}const r=ev.currentTarget.getBoundingClientRect();const x=Math.max(0,Math.min(90,(ev.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(94,(ev.clientY-r.top)/r.height*100));editor.body.fields.push({key:'veld_'+(editor.body.fields.length+1),page:previewPage,x:Math.round(x*10)/10,y:Math.round(y*10)/10,w:Math.min(50,100-x),h:5,size:11,color:'#183c3c',required:true});selectedField=editor.body.fields.length-1;renderEditor()}

function formatText(kind){const area=$('#blockText');if(!area)return;let start=area.selectionStart,end=area.selectionEnd,text=area.value;let replacement;if(kind==='bullet'){start=text.lastIndexOf('\n',start-1)+1;replacement=text.slice(start,end).split('\n').map(t=>'- '+t).join('\n')}else if(kind==='heading'){start=text.lastIndexOf('\n',start-1)+1;replacement='# '+text.slice(start,end)}else{const mark=kind==='bold'?'**':'*';replacement=mark+(text.slice(start,end)||'tekst')+mark}area.value=text.slice(0,start)+replacement+text.slice(end);fieldSet('template',area.value);area.focus();area.setSelectionRange(start,start+replacement.length)}

function fieldType(type){if(editor.body.googleDoc&&type!=='pageNumber'){toast('Bij Google-bronnen zijn alleen paginanummervelden beschikbaar.');renderEditor();return;}const f=editor.body.fields[selectedField];f.type=type;if(['contents','pageNumber'].includes(type)){delete f.autoFit;delete f.minSize;}if(!['text','prefilled'].includes(type)){delete f.columns;delete f.columnGapMm;delete f.lineSpacing;}if(type==='contents'){f.key='Inhoudsopgave';f.required=false;f.h=Math.min(60,100-f.y)}if(type==='pageNumber'){editor.body.numberingConfigured=true;f.key='Paginanummer';f.required=false;Object.assign(f,numberDefaults(),{font:'Open Sans'})}if(type==='prefilled'){f.template??='U krijgt een Interrail Pas met 4 reisdagen. Deze zijn bedoeld voor:\n- Heenreis\n- Terugreis';}if(['text','prefilled'].includes(type)){f.template??='Beste {{aanhefnaam}},\n\nUw reis naar {{bestemming}} begint op {{vertrekdatum}}.';f.h=Math.max(f.h,Math.min(25,100-f.y))}renderEditor()}

function fieldPreviewStyle(f){const full=f.backgroundColor&&f.backgroundFullWidth&&f.centerFullWidth&&!['contents','pageNumber'].includes(f.type);return `left:${full?0:f.x}%;top:${f.y}%;width:${full?100:f.w}%;height:${f.h}%;${full?'justify-content:center;text-align:center;':''}${f.columns===2?'background-image:linear-gradient(to right,transparent calc(50% - 1px),#c07c2c66 calc(50% - 1px),#c07c2c66 calc(50% + 1px),transparent calc(50% + 1px));':''}${f.backgroundColor?`background:transparent;color:${f.color||'#183c3c'}`:''}`;}
function fieldBackdropStyle(f){return `position:absolute;pointer-events:none;left:${f.backgroundFullWidth?0:f.x}%;top:${f.y}%;width:${f.backgroundFullWidth?100:f.w}%;height:${f.h}%;background:${f.backgroundColor||'transparent'};opacity:${f.backgroundColor?(f.backgroundOpacity??.5):0}`;}
function fieldSet(k,v){invalidateFit();const f=editor.body.fields[selectedField];f[k]=v;if(k==='size'&&f.autoFit&&Number.isFinite(v)&&v>=6){f.minSize=Math.min(f.minSize??8,v);const minimum=$('#fieldMinSize');if(minimum){minimum.max=String(v);minimum.value=String(f.minSize);}}const backdrop=$('#modal').querySelector(`.field-backdrop[data-field="${selectedField}"]`);if(backdrop)backdrop.style.cssText=fieldBackdropStyle(f);const percent=$('#backgroundPercent');if(percent)percent.textContent=Math.round((f.backgroundOpacity??.5)*100);const detected=$('#detectedKeys');if(detected)detected.textContent='Gevraagde gegevens: '+(fieldKeys(f).join(', ')||'geen');const current=editor.body.fields.filter(x=>x.page===previewPage).indexOf(f);const box=$('#modal').querySelectorAll('.fieldbox')[current];if(box){if(f.type==='pageNumber'){box.textContent='88';box.style.cssText=numberBadgeStyle(f)}else{box.textContent=fieldPreviewLabel(f);box.style.cssText=fieldPreviewStyle(f)}}$('#modal').querySelectorAll('option').forEach(o=>{if(o.textContent.includes(' · p')&&Number(o.value)===selectedField)o.textContent=f.key+' · p'+(f.page+1)})}

function replacePdf(){if(!confirm('Nieuwe PDF uploaden en invulvelden voor deze bouwsteen opnieuw instellen? Bestaande boekjes behouden hun versie.'))return;pickFile(async file=>{let a=await api('/api/upload?title='+encodeURIComponent(file.name),await file.arrayBuffer(),true);delete editor.body.googleDoc;delete editor.body.sanityText;delete editor.body.routeMaker;delete editor.body.trainScreen;Object.assign(editor.body,{asset:a.id,pages:a.pages,meta:a.meta,format:a.format,fields:[]});previewPage=0;selectedField=-1;renderEditor()})}

function invalidateFit(){fitRun++;const r=$('#fitResult');if(r)r.textContent='Gewijzigd — controleer de tekstpassing opnieuw.'}

function editorFitAction(result){const matches=editor.body.fields.map((f,index)=>({f,index})).filter(({f})=>f.key===result.name&&f.page+1===result.page);return matches.length===1?`<br><button type="button" onclick="jumpToEditorFitField(${matches[0].index})">Ga naar dit veld · Opmaak</button>`:'';}
function showFit(result){setEditorTab('tekst');const target=$('#fitResult');if(!target)return;target.innerHTML=result.results.map(r=>r.dynamic?`<div class="notice"><b>${esc(r.name)} · pagina ${r.page}</b><br>Wordt automatisch gevuld en gecontroleerd bij het maken van de PDF.</div>`:`<div class="${r.fits?'notice':'error'}"><b>${esc(r.name)} · pagina ${r.page}: ${r.fits?'Past met deze voorbeeldgegevens':'Past niet'}</b><br>Benodigde hoogte${r.columns===2?' per kolom (indicatie)':''}: ${r.heightPercent}%. Beschikbaar: ${r.availablePercent}%.<br>${esc(r.font||'Open Sans')} ${r.size} pt${r.shrunk?' (automatisch verkleind van '+esc(String(r.originalSize))+' pt)':''} · ${r.columns||1} kolom(men) · regelafstand ${Math.round((r.lineSpacing??1.5)*100)}%.${!r.widthFits?'<br>De tekst is ook breder dan het vlak.':''}${!r.fits?editorFitAction(r):''}${r.exampleKeys.length?'<br>Niet ingevuld; als voorbeeld gebruikt: '+r.exampleKeys.map(k=>esc('['+k+']')).join(', '):''}</div>`).join('')||'Geen tekstvelden om te controleren.'}

async function checkFit(){const seq=++fitRun;const target=$('#fitResult');setEditorTab('tekst');if(target)target.textContent='Tekstpassing wordt gecontroleerd…';try{const result=await api('/api/check-layout',{body:editor.body,values:fitExamples});if(seq===fitRun)showFit(result);return result}catch(e){if(seq===fitRun&&target)target.textContent='Controle niet gelukt: '+e.message;return null}}

async function saveBlock(){const button=$('#modal').querySelector('button.primary');if(button.disabled)return;button.disabled=true;button.textContent='Opslaan…';try{const isNewUpload=!editor.id;await refresh();showDuplicateTitle();if(!confirmDuplicateTitle()){setEditorTab('basis');return;}if(!confirmDestination()){setEditorTab('basis');return;}const fit=await api('/api/check-layout',{body:editor.body,values:fitExamples});const saved=await api('/api/save',editor);editor.id=saved.id;editor.revision=saved.revision;await refresh();if(isNewUpload){librarySort='newest';libraryLimit=recentUploadLimit;Object.assign(libraryFilters,{q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false})}if(!fit.fits){showFit(fit);toast('Bouwsteen opgeslagen. Let op: de tekst past nog niet met deze voorbeeldgegevens. Pas het vlak aan en sla opnieuw op.')}else{closeModal();render();toast('Bouwsteen opgeslagen. Tekstpassing gecontroleerd met voorbeeldgegevens.')}}catch(e){toast('Niet opgeslagen: '+e.message)}finally{button.disabled=false;button.textContent='Opslaan'}}

function extraMetadata(b){return `<p class="muted">Formaat bron-PDF: ${esc(b.format||'wordt bij opslaan bepaald')}</p><label>Bestemming (optioneel; voor Routes)</label><input list="destinations" value="${esc(b.destination||'')}" oninput="editor.body.destination=this.value.trim()"><datalist id="destinations">${uniqueValues(byKind('block').filter(o=>norm(o.body.country)===norm(b.country)).map(o=>o.body.destination||'')).map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label>Vulpagina’s · vaste volgorde</label><select onchange="editor.body.fillerOrder=Number(this.value)"><option value="0">Geen vulpagina</option>${[1,2,3].map(n=>`<option value="${n}" ${Number(b.fillerOrder)===n?'selected':''}>Vulpagina ${n}</option>`).join('')}</select><p class="muted">Gebruik drie bouwstenen van elk één pagina per formaat. De vulling komt vóór de allerlaatste PDF-pagina.</p>`}

function confirmDestination(){let b=editor.body;if(!categories(b).includes('Routes'))return true;if(!(state.countries||[]).includes(b.country)){toast('Kies een land uit de landenlijst voor deze route.');return false}if(!b.destination)return true;let known=byKind('block').filter(o=>norm(o.body.country)===norm(b.country)).map(o=>o.body.destination||'');let match=known.find(v=>norm(v)===norm(b.destination));if(match){b.destination=match;return true}return confirm('Bestemming “'+b.destination+'” toevoegen voor '+b.country+'?')}

function prefilledEditors(){return draft.body.sections.map((slot,i)=>{let s=slot.choice?slot.selected:slot;if(!s)return '';return (s.fields||[]).filter(f=>f.type==='prefilled').map((f,n)=>`<label>${esc(s.title)} · ${esc(f.key)}</label><textarea rows="7" data-section="${i}" data-key="${esc(f.key)}" oninput="prefilledValue(this)">${esc(s.values?.[f.key]??f.template??'')}</textarea><p class="muted">Vrij aanpasbaar voor dit ${draft.kind==='book'?'boekje':'sjabloon'}. Gebruik - voor een opsomming.</p>`).join('')}).join('')}

function prefilledValue(el){let s=draft.body.sections[Number(el.dataset.section)];s=s.choice?s.selected:s;s.values??={};s.values[el.dataset.key]=el.value;dirty=true}

function routeOptions(s,format=draft?.body.format||'A4'){return byKind('block').filter(o=>!o.body.archived&&o.body.format===format&&categories(o.body).includes('Routes')&&norm(o.body.country)===norm(s.country)&&(!s.destination||norm(o.body.destination)===norm(s.destination))).map(snapshot)}

function choiceCard(s,i){choiceRecognition(s);let options=s.choice==='route'?routeOptions(s):s.options||[];if(s.selected&&!options.some(o=>o.block===s.selected.block))options=[s.selected,...options];return `<div class="section"><div class="grow"><h3>${esc(s.title)} · ${s.choice==='route'?'Routekeuze':'Keuzepagina'}</h3>${s.choice==='route'?`<label>Land</label><select onchange="routeFilter(${i},'country',this.value)">${(state.countries||[]).map(c=>`<option ${c===s.country?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Bestemming (leeg = alle routes in dit land)</label><input list="routeDest${i}" value="${esc(s.destination||'')}" onchange="routeFilter(${i},'destination',this.value)"><datalist id="routeDest${i}">${uniqueValues(byKind('block').filter(o=>norm(o.body.country)===norm(s.country)&&categories(o.body).includes('Routes')).map(o=>o.body.destination||'')).map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`:''}${autoProposalNotice(s)}${tocBoldControl(s,i)}${tripFillerControl(s,i)}<label>${draft.kind==='template'?'Standaardkeuze (wijzigbaar bij boeking)':'Kies bouwsteen'}</label><select onchange="selectChoice(${i},this.value)"><option value="">Niet ingesteld</option>${options.map(o=>`<option value="${o.block}" ${s.selected?.block===o.block?'selected':''}>${esc(o.title)} · ${o.pages} pagina’s</option>`).join('')}</select>${s.choice==='manual'?`<button class="small" onclick="editChoice(${i})">Keuzes beheren</button>`:''}${s.selected?`<button class="small" onclick="previewSection(${i})">Bekijk</button>`:''}<button class="small" onclick="saveChoiceToLibrary(${i})">Bewaar in keuzebibliotheek</button>${s.todoIssue?`<p class="notice">${esc(s.todoIssue)}</p>`:''}${s.todoSelection?`<p class="muted">✓ Gekozen via ToDo: ${esc(s.todoSelection.text)}</p>`:''}${draft.kind==='book'&&draft.body.sanityBooking?`<button class="small" onclick="run(()=>applyBookingChoices())">ToDo-keuzes controleren</button>`:''}${s.choiceSource?'<p class="muted">ToDo-herkenning gekoppeld aan de keuzebibliotheek.</p>':''}</div><div><button class="small" onclick="move(${i},-1)">↑</button><button class="small" onclick="move(${i},1)">↓</button><button class="small" onclick="removeSection(${i})">×</button></div></div>`}

function routeFilter(i,k,v){let s=draft.body.sections[i];s[k]=v.trim();if(k==='country')s.destination='';s.selected=null;dirty=true;renderDraft()}

function selectChoice(i,id){let s=draft.body.sections[i];s.selected=clone((s.choice==='route'?routeOptions(s):s.options).find(o=>o.block===id)||null);s.choiceUserSelected=true;if(s.autoProposal){s.autoProposal.confirmed=true;s.autoProposal.reason='Zelf gekozen: '+(s.selected?.title||'Geen pagina');}delete s.todoSelection;delete s.todoIssue;refreshDraftBlocks();dirty=true;renderDraft()}

function createLocalChoice(position=null){closeModal();let title=prompt('Naam van de keuzepagina (bijvoorbeeld Nightjet of Routes)');if(!title?.trim())return;$('#modal').innerHTML=`<div class="bar"><h2>Soort keuzepagina</h2><button onclick="closeModal()">Annuleren</button></div><button id="manualChoice">Vooraf geselecteerde bouwstenen</button> <button id="routeChoice">Routes per land en bestemming</button>`;$('#manualChoice').onclick=()=>createChoice(title,'manual',position);$('#routeChoice').onclick=()=>createChoice(title,'route',position);$('#modal').showModal()}

function createChoice(title,type,position=null){const index=insertDraftSection({choice:type,title:title.trim(),options:[],selected:null,country:'Nederland',destination:''},position);closeModal();renderDraft();if(type==='manual')editChoice(index,true)}

function choiceRecognition(slot){const source=find(slot.choiceSource);if(source?.kind!=='choice')return;for(const option of slot.options||[]){const common=source.body.slot.options?.find(o=>o.block===option.block);if(common){option.todoMatch=common.todoMatch||'';option.todoMatchOverride=true;}}if(slot.selected){const option=slot.options?.find(o=>o.block===slot.selected.block);if(option)Object.assign(slot.selected,{todoMatch:option.todoMatch,todoMatchOverride:true});}}
function expandChoice(i){const slot=draft.body.sections[i];for(const option of slot.options||[]){const input=$('#modal').querySelector('[data-match-id="'+option.block+'"]');if(input){option.todoMatch=input.value;option.todoMatchOverride=true;}}editChoice(i,true,true);}
function editChoice(i,all=false,keep=false){let slot=draft.body.sections[i];if(!keep)choiceRecognition(slot);let options=all?byKind('block').filter(o=>!o.body.archived&&o.body.format===(draft.body.format||'A4')).map(snapshot):slot.options||[];$('#modal').innerHTML=`<h2>Keuzes voor ${esc(slot.title)}</h2><p>Herkenning geldt ook bij hergebruik van deze keuzepagina. Scheid varianten met een puntkomma: RITAD; RITAX. Eén variant moet binnen één ToDo voorkomen; extra tekst, hoofdletters en extra spaties maken geen verschil.</p>${!all?`<button onclick="expandChoice(${i})">Bouwstenen toevoegen of verwijderen</button>`:''}${options.map(o=>`<div class="panel"><label class="check"><input type="checkbox" data-id="${o.block}" ${slot.options.some(x=>x.block===o.block)?'checked':''}>${esc(o.title)} · ${o.pages} pagina’s</label><label>Herkennen in ToDo (optioneel)</label><input data-match-id="${o.block}" maxlength="300" value="${esc(slot.options.find(x=>x.block===o.block)?.todoMatch??o.todoMatch??'')}" placeholder="Bijvoorbeeld RITAD; RITAX"></div>`).join('')||'<p>Nog geen keuzes. Voeg eerst bouwstenen toe.</p>'}<button class="primary" id="saveChoices">Keuzes bewaren</button>`;$('#saveChoices').onclick=()=>run(async()=>{const selected=[...$('#modal').querySelectorAll('input[type="checkbox"]:checked')].map(el=>({...slot.options.find(o=>o.block===el.dataset.id)||snapshot(find(el.dataset.id)),todoMatch:$('#modal').querySelector('[data-match-id="'+el.dataset.id+'"]').value.trim(),todoMatchOverride:true}));let source=find(slot.choiceSource);if(source?.kind==='choice'){const updated=clone(source);updated.body.slot.options=clone(selected);if(updated.body.slot.selected&&!selected.some(o=>o.block===updated.body.slot.selected.block))updated.body.slot.selected=null;else if(updated.body.slot.selected){const option=selected.find(o=>o.block===updated.body.slot.selected.block);Object.assign(updated.body.slot.selected,{todoMatch:option.todoMatch,todoMatchOverride:true});}await api('/api/save',updated);await refresh();}slot.options=selected;if(slot.selected&&!selected.some(o=>o.block===slot.selected.block))slot.selected=null;choiceRecognition(slot);dirty=true;closeModal();renderDraft()});$('#modal').showModal()}







function bookingText(o){const b=o.body;return norm([o.title,b.status,b.templateName,bookTemplate(o).title,...Object.values(b.values||{}),...(b.sections||[]).flatMap(slot=>{const s=slot.choice?slot.selected:slot;return [slot.title,slot.country,slot.destination,s?.title,...Object.values(s?.values||{})]})].filter(Boolean).join(' '))}

function filterBookings(){const words=norm(bookingSearch).split(/\s+/).filter(Boolean);let count=0;document.querySelectorAll('[data-book-id]').forEach(el=>{const o=find(el.dataset.bookId);el.hidden=(!bookingOlder&&el.dataset.older==='true')||!matchesBookingTemplate(o)||!words.every(w=>bookingText(o).includes(w));if(!el.hidden)count++});const label=$('#bookingCount');if(label)label.textContent=count+(count===1?' boekje gevonden':' boekjes gevonden')+(bookingTrash?' in de prullenbak':'');const empty=$('#noBookingMatches');if(empty)empty.hidden=count>0;rememberBookletRoute();}
