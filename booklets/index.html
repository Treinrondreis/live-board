let sharedEditor=null;

function cleanSharedSlot(slot){const s=clone(slot);delete s.choiceSource;delete s.choiceRevision;delete s.values;for(const o of s.options||[])o.values={};if(s.selected)s.selected.values={};return s}

function allSharedChoices(){const saved=byKind('choice'),groups=new Map();const key=(format,slot)=>JSON.stringify([format,norm(slot.country||''),norm(slot.destination||'')]);const configured=new Set(saved.filter(o=>o.body.slot.choice==='route').map(o=>key(o.body.format,o.body.slot)));for(const block of byKind('block')){const b=block.body;if(b.archived||!categories(b).includes('Routes')||!b.destination?.trim()||!b.country||!['A4','A5'].includes(b.format))continue;const slot={choice:'route',title:'Routes - '+b.destination.trim(),country:b.country,destination:b.destination.trim(),options:[],selected:null};const k=key(b.format,slot);if(configured.has(k)||groups.has(k))continue;const id='auto-route-'+Array.from(k).map(c=>c.codePointAt(0).toString(16).padStart(4,'0')).join('');groups.set(k,{id,kind:'choice',title:slot.title,revision:1,automatic:true,body:{format:b.format,archived:false,slot}});}return [...saved,...groups.values()].sort((a,b)=>a.title.localeCompare(b.title,'nl'));}
function sharedChoice(id){return allSharedChoices().find(o=>o.id===id)}
function sharedChoiceList(pick=false,position=null){const choices=allSharedChoices().filter(o=>!pick||(!o.body.archived&&o.body.format===(draft.body.format||'A4')));return `<div class="panel" style="margin:18px 0"><div class="bar"><h2>Herbruikbare keuzepagina’s</h2>${pick?'':`<button onclick="editSharedChoice()">+ Nieuwe keuzepagina</button>`}</div><p class="muted">Bijvoorbeeld Nightjet, Bernina of Interrail. Toevoegen maakt een eigen kopie voor het sjabloon of boekje.</p><label>Zoek keuzepagina</label><input oninput="filterSharedChoices(this.value)" placeholder="Naam van de keuzepagina…">${choices.map(o=>`<div class="section" data-shared-name="${esc(norm(o.title))}"><div class="grow"><h3>${esc(o.title)}</h3><span class="muted">${esc(o.body.format)} · ${o.body.slot.choice==='route'?'Routekeuze':o.body.slot.options.length+' keuzes'} · ${o.automatic?'Automatisch · '+esc(o.body.slot.country):'versie '+o.revision}${o.body.archived?' · Gearchiveerd':''}</span></div><button onclick="${pick?'useSharedChoice':'editSharedChoice'}('${o.id}'${pick?','+position:''})">${pick?'Toevoegen':'Beheren'}</button></div>`).join('')||'<p>Nog geen passende keuzepagina’s opgeslagen.</p>'}</div>`}

function filterSharedChoices(q){document.querySelectorAll('[data-shared-name]').forEach(el=>el.hidden=!norm(q).split(/\s+/).every(w=>el.dataset.sharedName.includes(w)))}

function newChoice(position=null){$('#modal').innerHTML=`<div class="bar"><h2>Keuzepagina toevoegen</h2><button onclick="closeModal()">Sluiten</button></div>${sharedChoiceList(true,position)}<button onclick="createLocalChoice(${position})">+ Eenmalige keuzepagina maken</button>`;$('#modal').showModal()}

function useSharedChoice(id,position=null){const o=sharedChoice(id);if(!o)return;if(o.body.format!==(draft.body.format||'A4'))return;insertDraftSection({...clone(o.body.slot),title:o.title,choiceSource:o.id,choiceRevision:o.revision},position);refreshDraftBlocks();dirty=true;closeModal();renderDraft()}

function saveChoiceToLibrary(i){const slot=cleanSharedSlot(draft.body.sections[i]);const title=prompt('Naam in de bibliotheek',slot.title);if(!title?.trim())return;run(async()=>{const saved=await api('/api/save',{kind:'choice',title:title.trim(),body:{format:draft.body.format||'A4',slot:{...slot,title:title.trim()},archived:false}});draft.body.sections[i].choiceSource=saved.id;draft.body.sections[i].choiceRevision=saved.revision;dirty=true;await refresh();toast('Keuzepagina opgeslagen in de bibliotheek. Persoonlijke invulgegevens zijn niet meegenomen.');renderDraft()})}

function editSharedChoice(id){sharedEditor=id?clone(sharedChoice(id)):{kind:'choice',title:'',body:{format:'A4',archived:false,slot:{choice:'manual',title:'',options:[],selected:null,country:'Nederland',destination:''}}};if(sharedEditor.automatic){delete sharedEditor.id;delete sharedEditor.revision;delete sharedEditor.automatic;}renderSharedEditor();$('#modal').showModal()}

function sharedOptions(){const b=sharedEditor.body;let options=b.slot.choice==='route'?routeOptions(b.slot,b.format):b.slot.options;if(b.slot.selected&&!options.some(o=>o.block===b.slot.selected.block))options=[b.slot.selected,...options];return options}

function renderSharedEditor(){const e=sharedEditor,b=e.body,s=b.slot;const options=sharedOptions();let blocks=byKind('block').filter(o=>!o.body.archived&&o.body.format===b.format);const retained=(s.options||[]).filter(o=>!blocks.some(b=>b.id===o.block));$('#modal').innerHTML=`<div class="bar"><h2>Herbruikbare keuzepagina</h2><button onclick="closeModal()">Annuleren</button></div><p class="muted">ToDo-herkenning geldt ook voor bestaande gekoppelde keuzepagina’s.</p><label>Naam</label><input id="sharedTitle" value="${esc(e.title)}" oninput="sharedEditor.title=this.value"><div class="row"><div><label>Formaat</label><select onchange="sharedFormat(this.value)">${['A4','A5'].map(f=>`<option ${b.format===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Soort</label><select onchange="sharedEditor.body.slot.choice=this.value;sharedEditor.body.slot.selected=null;renderSharedEditor()"><option value="manual" ${s.choice==='manual'?'selected':''}>Vooraf geselecteerde bouwstenen</option><option value="route" ${s.choice==='route'?'selected':''}>Routes</option></select></div></div>${s.choice==='manual'?`<label>Toegestane bouwstenen</label>${blocks.map(o=>`<label class="check"><input type="checkbox" data-shared-block="${o.id}" ${s.options.some(x=>x.block===o.id)?'checked':''} onchange="sharedToggle(this.dataset.sharedBlock,this.checked)">${esc(o.title)} · ${o.body.pages} pagina’s</label>`).join('')}${retained.map(o=>`<label class="check"><input type="checkbox" checked data-shared-block="${o.block}" onchange="sharedToggle(this.dataset.sharedBlock,this.checked)">${esc(o.title)} (bewaarde versie)</label>`).join('')}`:`<label>Land</label><select onchange="sharedRoute('country',this.value)">${state.countries.map(c=>`<option ${s.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Bestemming (optioneel)</label><input list="sharedDestinations" value="${esc(s.destination)}" onchange="sharedRoute('destination',this.value)"><datalist id="sharedDestinations">${uniqueValues(byKind('block').filter(o=>categories(o.body).includes('Routes')&&norm(o.body.country)===norm(s.country)).map(o=>o.body.destination||'')).map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`}${s.choice==='manual'?`<h3>Herkennen in ToDo</h3><p class="muted">Scheid varianten met een puntkomma. Eén variant moet voorkomen binnen één ToDo.</p>${s.options.map(o=>`<label>${esc(o.title)}</label><input maxlength="300" value="${esc(o.todoMatch||'')}" placeholder="Bijvoorbeeld RITAD; RITAX" oninput="sharedMatch('${o.block}',this.value)">`).join('')}`:''}${autoMetadataControls(b,'shared')}<label>Standaardkeuze</label><select onchange="sharedSelect(this.value)"><option value="">Niet ingesteld</option>${options.map(o=>`<option value="${o.block}" ${s.selected?.block===o.block?'selected':''}>${esc(o.title)}</option>`).join('')}</select><label class="check"><input type="checkbox" ${b.archived?'checked':''} onchange="sharedEditor.body.archived=this.checked">Archiveren voor nieuwe toevoegingen</label><button class="primary" id="saveSharedChoice" onclick="saveSharedChoice(this)">Opslaan in bibliotheek</button>`}

function sharedFormat(format){sharedEditor.body.format=format;sharedEditor.body.slot.options=[];sharedEditor.body.slot.selected=null;renderSharedEditor()}

function sharedRoute(k,v){const s=sharedEditor.body.slot;s[k]=v.trim();if(k==='country')s.destination='';s.selected=null;renderSharedEditor()}

function sharedToggle(id,checked){const s=sharedEditor.body.slot;if(checked){if(!s.options.some(o=>o.block===id))s.options.push(snapshot(find(id)))}else{s.options=s.options.filter(o=>o.block!==id);if(s.selected?.block===id)s.selected=null}renderSharedEditor()}

function sharedMatch(id,value){const s=sharedEditor.body.slot,o=s.options.find(o=>o.block===id);if(o){o.todoMatch=value;o.todoMatchOverride=true;}if(s.selected?.block===id)Object.assign(s.selected,{todoMatch:value,todoMatchOverride:true});}
function sharedSelect(id){sharedEditor.body.slot.selected=clone(sharedOptions().find(o=>o.block===id)||null)}

async function enrichDriveTickets(result,provider,strict=false){
 const wanted=[...new Set(result.references?.length?result.references:result.messages?.length?result.messages.filter(m=>m.latest).map(m=>m.reference):[result.query])];
 const patterns={ns:/^[A-Z0-9]{6,8}$/,mav:/^\d{10}$/,db:/^(?:\d{12}|[A-Z0-9]{6})$/,obb:/^(?:\d{16}|[A-Z0-9]{6,8})$/,cd:/^(?:\d{9,11}|[A-Z0-9]{6})$/,dfds:/^\d{6,10}$/};const missing=wanted.filter(ref=>{const m=result.messages.find(m=>m.reference===ref&&m.latest);return patterns[provider].test(ref)&&!m?.cancelled&&!m?.tickets.length;});if(!missing.length)return;
 try{const payload={provider,query:result.query,references:missing},r=await api('/api/tickets/drive-search',payload);
  for(const ref of missing){const files=r.items.filter(f=>f.reference===ref);if(!files.length)continue;let m=result.messages.find(m=>m.reference===ref&&m.latest);if(!m){m={id:'drive:'+ref,reference:ref,references:[ref],subject:'Tickets klaargezet in Google Drive',date:files[0].updatedAt||new Date().toISOString(),latest:true,cancelled:false,tickets:[],manualLinks:[]};result.messages.push(m);}m.tickets=files.map(f=>({id:'drive:'+f.id,title:f.title,drive:{provider,query:ref,references:[ref],id:f.id,updatedAt:f.updatedAt}}));m.selected=true;m.fromDrive=true;}
 }catch(e){if(strict)throw e;result.driveWarning='Drive-tickets niet gecontroleerd: '+e.message;}
}

function ticketFetchPDFs(button){run(async()=>{button.disabled=true;const p=ticketPick,epoch=bookletDialogEpoch;p.pages=[];p.warnings=[];p.importNotices=[];try{const guard=()=>{if(epoch!==bookletDialogEpoch)throw Error('Deze stap is verlaten. Zoek de tickets opnieuw.');if(ticketPick!==p||draft!==p.book||draft.body.sanityBooking?.id!==p.bookingId)throw Error('Het boekje is gewijzigd. Start de import opnieuw.');};guard();const selected=[...document.querySelectorAll('.ticket-mail-choice:checked')].map(x=>p.result.messages[Number(x.value)]);if(!selected.length)throw Error('Selecteer minstens één mail.');const refs=selected.map(m=>m.reference).filter(Boolean);if(new Set(refs).size<refs.length&&!confirm('Meerdere mails voor dezelfde referentie kunnen dubbele of oudere tickets toevoegen. Toch doorgaan?'))return;const tickets=selected.flatMap(m=>m.tickets.map(t=>({...t,mail:m.id,reference:m.reference})));if(tickets.length>30)throw Error('Maximaal dertig PDF’s per import.');const pages=[];for(let n=0;n<tickets.length;n++){guard();button.textContent=`PDF ${n+1} van ${tickets.length} ophalen…`;let a;try{a=await ticketDownloadAsset(tickets[n]);}catch(e){guard();if(e.code!=='TICKET_NOT_PDF')throw e;p.importNotices.push(tickets[n].reference+' · '+tickets[n].title+': link levert geen PDF; overgeslagen.');continue;}guard();pages.push(...await inspectTicketPages(tickets[n],a,p.result,p.provider));guard();if(pages.length>100)throw Error('Meer dan honderd ticketpagina’s. Kies minder mails.');}if(!pages.length)throw Error(p.importNotices.join(' · ')||'Geen ticket-PDF’s opgehaald.');p.pages=pages;const all=clone(pages);p.originalPages=all;let issue='';if(p.slot){try{p.pages=momentPages(pages,p.slot);}catch(e){issue=e.message;}}else p.pages=datedPages(pages);p.dateIssue=issue;ticketPagesForm();}finally{button.disabled=false;button.textContent='Geselecteerde ticket-PDF’s ophalen'}})}
function ticketPagesForm(){const p=ticketPick;$('#modal').innerHTML=`<div class="bar"><h2>Kies en orden ticketpagina’s</h2><button onclick="closeModal()">Annuleren</button></div><p>Verplaats pagina’s met de pijlen of verwijder wat niet in dit boekje hoort. De originele PDF’s blijven behouden.</p>${draft.body.format==='A5'?'<div class="notice">A4-tickets worden verkleind om volledig op A5 liggend te passen. Controleer de leesbaarheid en de barcode in een proefdruk; A4 geeft meer ruimte.</div>':''}${ticketSummary({ticketImport:true,pageSources:p.pages})}${ticketImportNotices({importNotices:[...(p.importNotices||[]),...ticketOrderWarnings(p.pages)]})}${documentWarnings(p.warnings)}${p.dateIssue?`<p class="notice">${esc(p.dateIssue)}</p>`:''}<button onclick="sortPickerDates('ticket')">Sorteren op datum</button>${p.slot&&slotMoment(p.slot)?'<button onclick="chooseTicketMoment()">Pagina’s van dit reismoment kiezen</button><button onclick="restoreTicketPages()">Alle bronpagina’s tonen</button>':''}<div id="ticketPages" class="grid"></div>${manualDateControl(p,'ticket')}<button class="primary" onclick="ticketAddToBook(this)">Gekozen pagina’s aan dit boekje toevoegen</button>`;ticketPagesDraw()}

let googlePagePick=null;
function chooseGooglePages(document,previous){return new Promise(resolve=>{
 googlePagePick={document,resolve};
 const chosen=previous||Array.from({length:document.pages},(_,n)=>n);
 $('#modal').innerHTML=`<div class="bar"><h2>Kies pagina’s om te importeren</h2><button onclick="closeModal()">Annuleren</button></div><p>${esc(document.title)} · ${document.pages} pagina’s in ${esc(document.format)}.</p><p>${previous?'Controleer uw eerdere selectie opnieuw: door wijzigingen kan de inhoud op een ander paginanummer staan.':'Alle pagina’s zijn geselecteerd. Vink uit wat u niet wilt meenemen.'}</p><div class="actions"><button onclick="googleSelectAll(true)">Alles selecteren</button><button onclick="googleSelectAll(false)">Selectie wissen</button><button class="primary" id="googlePageConfirm" onclick="confirmGooglePages(this)">Geselecteerde pagina’s gebruiken</button><span id="googlePageCount" role="status"></span></div><div class="grid">${Array.from({length:document.pages},(_,n)=>`<label class="card" style="padding:12px"><span class="check"><input class="google-page-choice" type="checkbox" value="${n}" ${chosen.includes(n)?'checked':''} onchange="googlePageCount()">Pagina ${n+1}</span><img loading="lazy" src="/files/preview/${document.asset}/${n}" alt="Voorbeeld pagina ${n+1}" style="width:100%;min-height:100px;object-fit:contain"><a href="/files/preview/${document.asset}/${n}" target="_blank" rel="noopener">Groter bekijken</a></label>`).join('')}</div>`;
 if(!$('#modal').open)$('#modal').showModal();googlePageCount();
 $('#modal').addEventListener('cancel',()=>{if(googlePagePick){googlePagePick.resolve(null);googlePagePick=null;}},{once:true});
})}
function googlePageCount(){const n=document.querySelectorAll('.google-page-choice:checked').length;$('#googlePageCount').textContent=n+' pagina’s geselecteerd';$('#googlePageConfirm').disabled=!n}
function googleSelectAll(value){document.querySelectorAll('.google-page-choice').forEach(c=>c.checked=value);googlePageCount()}
function confirmGooglePages(button){run(async()=>{button.disabled=true;try{const pick=googlePagePick;if(!pick)return;const pages=[...document.querySelectorAll('.google-page-choice:checked')].map(c=>Number(c.value));const result=await api('/api/google/select-pages',{document:pick.document,pages});if(googlePagePick!==pick)return;googlePagePick=null;pick.resolve(result)}finally{button.disabled=false}})}
async function reviewGooglePages(body){const previous=body.googleDoc.selectedPages;const fetched=await api('/api/google/import',{...body.googleDoc,selectedPages:null});const r=await chooseGooglePages(fetched,previous);if(!r)return null;const oldPages=previous||Array.from({length:body.pages},(_,n)=>n),newPages=r.googleDoc.selectedPages||Array.from({length:r.pages},(_,n)=>n);const old=body.fields||[];const fields=[];for(let page=0;page<newPages.length;page++){const index=oldPages.indexOf(newPages[page]),field=old.find(f=>f.type==='pageNumber'&&f.page===index);if(field)fields.push({...field,page});else if(index<0&&old.length)fields.push({key:'Paginanummer',type:'pageNumber',page,x:45,y:100-34/(r.format==='A5'?419.528:841.89)*100,w:10,h:3,size:10,font:'Open Sans',color:'#ffffff',required:false});}return {asset:r.asset,pages:r.pages,format:r.format,googleDoc:r.googleDoc,fields,numberingConfigured:true}}
function reviewGoogleOneOff(i){run(async()=>{const b=draft.body.sections[i],r=await reviewGooglePages(b);if(r){Object.assign(b,r);dirty=true;}closeModal();renderDraft()})}

let trainScreenDraft=null;
function trainScreenMaker(index=null,block=false){
  const original=block?editor:(Number.isInteger(index)?draft?.body.sections[index]:null);
  const blank=()=>({departureStation:'',arrivalStation:'',departureTime:'',arrivalTime:'',departureDate:'',arrivalDate:''});
  trainScreenDraft={book:draft,original,index,block,candidates:[],reviewed:true,result:null,model:clone(original?.trainScreen||original?.body?.trainScreen||{mode:'roundtrip',format:draft?.body.format||'A5',title:'Stedentrip Wenen',heading:'Treinreis naar',subtitle:'Met de nachttrein',train:'Nightjet',showDates:false,legs:[{...blank(),arrivalStation:'Wien Hbf'},{...blank(),departureStation:'Wien Hbf'}],destinations:['Nederland','Wenen','Boedapest','Praag','Nederland']})};
  trainScreenForm();
}
function trainScreenMode(mode){
  const m=trainScreenDraft.model;
  if(mode==='circuit'){if(m.title==='Stedentrip Wenen')m.title='Uw rondreis';if(m.heading==='Treinreis naar')m.heading='Treinrondreis';if(m.subtitle==='Met de nachttrein')m.subtitle='Europa ontdekken';if(m.train==='Nightjet')m.train='Met de trein';}
  else{if(m.title==='Uw rondreis')m.title='Stedentrip Wenen';if(m.heading==='Treinrondreis')m.heading='Treinreis naar';if(m.subtitle==='Europa ontdekken')m.subtitle='Met de nachttrein';if(m.train==='Met de trein')m.train='Nightjet';}
  trainScreenInput('mode',mode);trainScreenForm();
}
function trainScreenInput(key,value){trainScreenDraft.model[key]=value;trainScreenDraft.result=null;const box=$('#trainScreenResult');if(box)box.innerHTML='Maak een nieuw voorbeeld na het wijzigen van de gegevens.';}
function trainScreenLeg(i,key,value){trainScreenDraft.model.legs[i][key]=value;trainScreenDraft.result=null;if($('#trainScreenResult'))$('#trainScreenResult').innerHTML='Maak een nieuw voorbeeld na het wijzigen van de gegevens.';}
function trainScreenForm(){
  const t=trainScreenDraft,m=t.model;
  const input=(key,label)=>`<label>${label}</label><input maxlength="80" value="${esc(m[key])}" oninput="trainScreenInput('${key}',this.value)">`;
  const leg=(i,label)=>`<h3 style="margin-top:18px">${label}</h3>${t.candidates.length?`<label>Rit uit tickets overnemen</label><select onchange="trainScreenSelect(${i},this.value)"><option value="">Kies de juiste rit…</option>${t.candidates.map((r,n)=>`<option value="${n}">${esc(r.departureStation)} ${esc(r.departureTime)} → ${esc(r.arrivalStation)} ${esc(r.arrivalTime)} · ticket p${r.sourcePage+1}</option>`).join('')}</select>`:''}${[['departureStation','Van station'],['arrivalStation','Naar station'],['departureTime','Vertrektijd'],['arrivalTime','Aankomsttijd'],...(m.showDates?[['departureDate','Vertrekdatum (optioneel)'],['arrivalDate','Aankomstdatum (optioneel)']]:[])].map(([k,l])=>`<label>${l}</label><input ${k.endsWith('Date')?'type="date"':''} maxlength="80" placeholder="${k.endsWith('Time')?'19:58':''}" value="${esc(m.legs[i][k])}" oninput="trainScreenLeg(${i},'${k}',this.value)">`).join('')}`;
  $('#modal').innerHTML=`<div class="bar"><h2>Treinscherm maken</h2><button onclick="closeModal()">Sluiten</button></div><p>Maak een persoonlijke PDF-pagina voor het boekje. Alle teksten zijn wijzigbaar.</p><div class="two"><div><label>Variant</label><select onchange="trainScreenMode(this.value)"><option value="roundtrip" ${m.mode==='roundtrip'?'selected':''}>Heenreis en terugreis</option><option value="circuit" ${m.mode==='circuit'?'selected':''}>Rondreis met bestemmingen</option></select>${!t.book?`<label>Formaat</label><select onchange="trainScreenInput('format',this.value)"><option value="A5" ${m.format==='A5'?'selected':''}>A5 liggend</option><option value="A4" ${m.format==='A4'?'selected':''}>A4 staand</option></select>`:`<p class="muted">Formaat van dit boekje: ${esc(m.format)}.</p>`}${input('heading','Bovenste label')}${input('title','Titel / bestemming')}${input('subtitle','Klein label')}${input('train','Trein / ondertitel')}${m.mode==='roundtrip'?`<label class="check"><input type="checkbox" ${m.showDates?'checked':''} onchange="trainScreenInput('showDates',this.checked);trainScreenForm()">Datums tonen als ze beschikbaar zijn</label>${t.book?'<button onclick="trainScreenReadTickets(this)">Stations en tijden uit tickets lezen</button><p class="muted">Gebruikt de ticketpagina’s die al bij dit boekje zijn opgehaald. Kies daarna de juiste heen- en terugrit.</p>':''}${leg(0,'Heenreis')}${leg(1,'Terugreis')}${!t.reviewed?'<label class="check"><input type="checkbox" onchange="trainScreenDraft.reviewed=this.checked">Ik heb de overgenomen stations, tijden en richting gecontroleerd</label>':''}`:`<label>Bestemmingen in reisvolgorde (één per regel, maximaal zes)</label><textarea rows="6" oninput="trainScreenInput('destinations',this.value.split('\\n').map(x=>x.trim()).filter(Boolean))">${esc(m.destinations.join('\n'))}</textarea>${t.book?'<button onclick="trainScreenDestinations()">Bestemmingen uit dit boekje gebruiken</button>':''}<p class="muted">Hier gebruiken we plaatsnamen, zoals Wenen en Boedapest. In de ticketvariant behouden we de stationsnamen van het ticket, zoals Wien Hbf.</p>`}<button class="primary" style="margin-top:18px" onclick="trainScreenBuild(this)">Voorbeeld-PDF maken</button><p id="trainScreenMessage" role="status"></p></div><div id="trainScreenResult"><p class="muted">Het voorbeeld verschijnt hier. De foto blijft op de oorspronkelijke resolutie; tekst en lijnen worden scherp in de PDF gezet.</p></div></div>`;
  if(!$('#modal').open)$('#modal').showModal();
}
function trainScreenTicketPages(){
  if(draft!==trainScreenDraft.book)throw Error('Open het treinscherm opnieuw vanuit het juiste boekje.');
  const pages=[];
  for(const slot of draft.body.sections){if(documentConditionSkipped(slot)||slot.omitted)continue;const s=slot.choice?slot.selected:slot;if(!s)continue;if(!(s.ticketImport||slot.documentKind==='ticket'||/^ticket/i.test(slot.documentKind||'')))continue;
    if(s.pageSources?.length)pages.push(...s.pageSources.map(p=>({asset:p.asset,page:p.page})));
    else if(s.asset)for(let page=0;page<s.pages;page++)pages.push({asset:s.asset,page});
  }
  const unique=[...new Map(pages.map(p=>[p.asset+':'+p.page,p])).values()];
  if(!unique.length)throw Error('Haal eerst tickets op in dit boekje via Boekingsdocument of Tickets uit e-mail.');
  if(unique.length>50)throw Error('Er zijn meer dan vijftig ticketpagina’s. Beperk eerst de ticketselectie.');return unique;
}
function trainScreenReadTickets(button){return run(async()=>{const t=trainScreenDraft;button.disabled=true;try{const r=await api('/api/train-screen/inspect',{pages:trainScreenTicketPages()});if(trainScreenDraft!==t||draft!==t.book||!$('#modal').open)return;t.candidates=r.candidates;t.result=null;trainScreenForm();$('#trainScreenMessage').textContent=r.message;}finally{button.disabled=false}})}
function trainScreenSelect(i,value){if(value==='')return;const r=trainScreenDraft.candidates[Number(value)];if(!r)return;for(const k of Object.keys(trainScreenDraft.model.legs[i]))trainScreenDraft.model.legs[i][k]=r[k]||'';trainScreenDraft.reviewed=false;trainScreenDraft.result=null;trainScreenForm();}
function trainScreenDestinations(){const t=trainScreenDraft;if(draft!==t.book)return;const places=[];for(const slot of draft.body.sections){const s=slot.choice?slot.selected:slot;if(!s||slot.omitted||documentConditionSkipped(slot))continue;const place=slot.destination||find(s.block)?.body.destination;if(place&&places.at(-1)!==place)places.push(place)}if(places.length<2){toast('Nog geen twee routebestemmingen gevonden. Vul de bestemmingen zelf in.');return}if(places.length>6){toast('Meer dan zes bestemmingen gevonden. Kies de belangrijkste bestemmingen.');return}t.model.destinations=places;t.result=null;trainScreenForm();}
function trainScreenBuild(button){return run(async()=>{const t=trainScreenDraft;if(!t.reviewed)throw Error('Controleer en bevestig eerst de overgenomen ticketgegevens.');if(t.book&&draft!==t.book)throw Error('Het boekje is gewijzigd. Open het treinscherm opnieuw.');button.disabled=true;try{const model=clone(t.model),r=await api('/api/train-screen/render',model);if(trainScreenDraft!==t||!$('#modal').open||JSON.stringify(t.model)!==JSON.stringify(model))return;t.result=r;$('#trainScreenResult').innerHTML=`<img style="width:100%;max-height:65vh;object-fit:contain" src="/files/preview/${r.asset}/0" alt="Voorbeeld treinscherm"><p><a class="button" href="/files/asset/${r.asset}?download=1" target="_blank">PDF downloaden</a></p><button class="primary" onclick="trainScreenUse()">${t.book?'Gebruik deze pagina in het boekje':'Bouwsteen instellen'}</button><p class="muted">Controleer het voorbeeld voordat u het toevoegt. Eerdere PDF’s blijven bewaard.</p>`;}finally{button.disabled=false}})}
function trainScreenUse(){const t=trainScreenDraft,r=t.result;if(!r)return;
  if(t.book){if(draft!==t.book)return toast('Het boekje is gewijzigd. Open het treinscherm opnieuw.');const section={oneOff:true,title:r.title,tocTitle:r.title,asset:r.asset,pages:1,fields:[],values:{},numberingConfigured:true,recto:false,trainScreen:clone(r.trainScreen)};if(t.original){const index=draft.body.sections.indexOf(t.original);if(index<0)return toast('Deze pagina is verwijderd.');draft.body.sections[index]={...t.original,...section,fields:clone(t.original.fields||[])};delete draft.body.sections[index].block;delete draft.body.sections[index].revision;}else draft.body.sections.push(section);dirty=true;closeModal();renderDraft();toast('Treinscherm toegevoegd. Sla het boekje op.');}

function routeResults(which,result){routeDraft[which+'Results']=result.results;routeDraft[which]=null;const target=$('#'+(which==='start'?'routeStartResults':'routeEndResults'));if(!target)return;const station=result.station;target.innerHTML=(station?`<div class="notice"><b>Adres uit stationslijst: ${esc(station.name)}</b><p>${esc(station.address)} · ${esc(station.country)}</p><p>${esc(station.status)}. ${esc(station.note||'')}</p><a href="${esc(station.source)}" target="_blank" rel="noopener">Bron bekijken</a><p>Controleer hieronder waar dit adres op de kaart is gevonden.</p></div>`:'')+(result.results.length?`<label>${result.results[0].catalog?'Station herkend — kies uit de adressenlijst':'Kies de juiste locatie'}</label><select id="route-${which}-choice" onchange="routeChoose('${which}',this.value)"><option value="">Selecteer een resultaat…</option>${result.results.map((p,n)=>`<option value="${n}">${esc(p.name)} — ${esc(p.resolvedAddress||p.address)}${p.country?' · '+esc(p.country):''}</option>`).join('')}</select>`:'<p class="error">Geen locatie gevonden. Probeer een ander adres of controleer de stationsingang.</p>')+(which==='start'?`<button class="small" style="margin-top:8px" onclick="routeSearch('start',this,true)">Een ander adres zoeken</button>`:'')}

function isTicketSlot(s){return s?.documentKind==='combinedTickets'||!!ticketKinds[s?.documentKind];}
function slotMoment(s){return Number(s.documentKind==='voucher'?s.voucherMoment||0:s.ticketMoment||0);}
function validTravelDate(v){if(!/^20\d{2}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===v;}

function cancelAutomaticBuilder(){automaticWizard=null;closeModal();}
function automaticInput(key,value){const w=automaticWizard;if(!w)return;w[key]=value;w.run++;w.proposal=null;const panel=$('#automaticProposal');if(panel)panel.innerHTML='<p class="muted">Gegevens gewijzigd. Maak een nieuw voorstel.</p>';}
function renderAutomaticBuilder(){const w=automaticWizard;if(!w)return;$('#modal').innerHTML=`<div class="bar"><div><h2>${w.kind==='book'?'Automatisch boekje voorstellen':'Automatisch reissjabloon voorstellen'}</h2><p class="muted">Eerst een voorstel, daarna aanpassen en opslaan. Herkenning gebruikt je eigen bibliotheek.</p></div><button onclick="cancelAutomaticBuilder()">Annuleren</button></div><div class="row"><div><label>Formaat</label><select aria-label="Formaat automatisch voorstel" onchange="automaticInput('format',this.value)">${['A4','A5'].map(f=>`<option ${f===w.format?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Boekingsnummer ${w.kind==='template'?'(optioneel als voorbeeldreis)':''}</label><div class="actions"><input id="automaticBookingNumber" style="flex:1;min-width:150px" placeholder="Bijvoorbeeld 6563A" onkeydown="if(event.key==='Enter')searchAutomaticBooking()"><button onclick="searchAutomaticBooking()">Boeking zoeken</button></div></div></div><div id="automaticBookingResults">${w.booking?`<p>✓ ${esc(w.booking.number)} · ${esc(w.booking.name)} · ${esc(w.booking.trip)} <button class="small" onclick="automaticClearBooking()">Andere reis</button></p>`:''}</div><label>Reisomschrijving ${w.kind==='book'?'(aanvullend)':''}</label><textarea rows="3" id="automaticJourney" maxlength="4000" oninput="automaticInput('journey',this.value)" placeholder="Bijvoorbeeld: stedentrip Wenen met Nightjet, RITAD, Premier Inn Wien">${esc(w.journey)}</textarea><p class="muted">${w.kind==='book'?'Selecteer de juiste boeking; de ToDo’s worden alleen gelezen.':'Beschrijf de bestemming en treinen, of kies een boeking als voorbeeld. Het sjabloon bevat geen klantgegevens.'}</p><button class="primary" id="automaticGenerate" onclick="generateAutomaticProposal(this)">Voorstel maken</button><div id="automaticProposal"></div>`;if(w.proposal)renderAutomaticProposal();}
function automaticClearBooking(){const w=automaticWizard;if(!w)return;w.booking=null;w.items=[];w.run++;w.proposal=null;renderAutomaticBuilder();}
async function searchAutomaticBooking(){return run(async()=>{const w=automaticWizard;if(!w)return;const token=++w.run;w.proposal=null;w.booking=null;$('#automaticProposal').innerHTML='';$('#automaticBookingResults').textContent='Boekingen zoeken…';const r=await api('/api/booking-data/search',{number:$('#automaticBookingNumber').value});if(automaticWizard!==w||w.run!==token||!$('#modal').open)return;w.items=r.items;$('#automaticBookingResults').innerHTML=r.items.length?`<p>Kies de juiste boeking.</p>${r.items.map((b,i)=>`<div class="panel"><b>${esc(b.number)} · ${esc(b.name)}</b><p>${esc(b.trip)} · ${esc(b.departure)} – ${esc(b.returnDate)}</p><button onclick="selectAutomaticBooking(${i})">Deze boeking als basis</button></div>`).join('')}`:'<p>Geen boeking gevonden.</p>';});}
function selectAutomaticBooking(i){const w=automaticWizard,b=w?.items[i];if(!b)return;w.booking=clone(b);w.run++;w.proposal=null;renderAutomaticBuilder();}
async function generateAutomaticProposal(button){return run(async()=>{const w=automaticWizard;if(!w)return;if(w.kind==='book'&&!w.booking)throw Error('Zoek en selecteer eerst de juiste Sanity-boeking.');const token=++w.run,booking=w.booking?clone(w.booking):null,journey=w.journey,format=w.format;button.disabled=true;button.textContent='Voorstel maken…';try{let context=booking;if(booking){const result=await api('/api/booking-data/documents',{bookingId:booking.id});if(result.booking?.id!==booking.id)throw Error('De ToDo’s horen niet bij de geselecteerde boeking.');context={...booking,todos:result.booking.todos||[]};}if(automaticWizard!==w||w.run!==token||!$('#modal').open)return;const proposal=await api('/api/automatic-build',{kind:w.kind,format,journey,booking:context,...(w.kind==='book'?{title:booking.number+' · '+booking.name+' – '+booking.trip}:{})});if(automaticWizard!==w||w.run!==token||!$('#modal').open)return;w.proposal=proposal;renderAutomaticProposal();}finally{button.disabled=false;button.textContent='Voorstel maken';}});}
function renderAutomaticProposal(){const w=automaticWizard,p=w?.proposal;if(!p)return;$('#automaticProposal').innerHTML=`<hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2>Voorgestelde samenstelling</h2><label>Naam voor ${w.kind==='book'?'dit boekje':'dit sjabloon'}</label><input aria-label="Naam automatisch voorstel" value="${esc(p.title)}" oninput="automaticWizard.proposal.title=this.value"><p>${p.body.sections.length} onderdelen · ${p.body.format}. Je kunt keuzes wijzigen, onderdelen verplaatsen of weglaten.</p>${p.body.sections.map((s,i)=>`<div class="section"><div class="grow"><h3>${i+1}. ${esc(s.title)}</h3>${s.choice==='manual'?`<label>Voorgestelde pagina</label><select aria-label="Voorstel ${esc(s.title)}" onchange="automaticChoose(${i},this.value)">${s.options.map(o=>`<option value="${esc(o.block)}" ${o.block===s.selected?.block?'selected':''}>${esc(o.title)}</option>`).join('')}</select>${autoProposalNotice(s)}`:`<p class="muted">Boekingsdocument · wordt bij een boekje opgehaald. ${s.documentKind==='combinedTickets'?'NS, MAV, DB, ÖBB, ČD en DFDS: alle aanwezige bronnen combineren; minstens één nodig.':''}</p>`}</div><div class="actions"><button class="small" aria-label="Onderdeel ${i+1} omhoog" onclick="automaticMove(${i},-1)">↑</button><button class="small" aria-label="Onderdeel ${i+1} omlaag" onclick="automaticMove(${i},1)">↓</button><button class="small" aria-label="Onderdeel ${i+1} weglaten" onclick="automaticRemove(${i})">×</button></div></div>`).join('')}${documentWarnings(p.warnings)}<button class="primary" id="automaticApply" onclick="applyAutomaticProposal(this)">${w.kind==='book'?'Gebruik voorstel en haal documenten op':'Gebruik voorstel als bewerkbaar sjabloon'}</button><p class="muted">Daarna kun je verder aanpassen. Opslaan doe je in het boekje of sjabloon.</p>`;}
function automaticChoose(i,id){const slot=automaticWizard?.proposal?.body.sections[i],option=slot?.options.find(o=>o.block===id);if(!option)return;slot.selected=clone(option);slot.choiceUserSelected=true;slot.autoProposal={...slot.autoProposal,confirmed:true,reason:'Zelf gekozen: '+option.title};renderAutomaticProposal();}
function automaticMove(i,delta){const rows=automaticWizard?.proposal?.body.sections;if(!rows||i+delta<0||i+delta>=rows.length)return;[rows[i],rows[i+delta]]=[rows[i+delta],rows[i]];renderAutomaticProposal();}
function automaticRemove(i){automaticWizard?.proposal?.body.sections.splice(i,1);renderAutomaticProposal();}
async function applyAutomaticProposal(button){return run(async()=>{const w=automaticWizard,p=w?.proposal;if(!p)return;if(!p.title.trim())throw Error('Vul een naam voor het voorstel in.');button.disabled=true;try{await refresh();if(automaticWizard!==w||draft!==w.baseDraft||!$('#modal').open)return;const revisions=Object.fromEntries(state.objects.filter(o=>['block','choice'].includes(o.kind)).map(o=>[o.id,o.revision]));if(JSON.stringify(Object.entries(revisions).sort())!==JSON.stringify(Object.entries(p.catalogRevisions).sort()))throw Error('De bibliotheek is gewijzigd. Maak eerst een nieuw voorstel met de nieuwste pagina’s.');const body=clone(p.body);if(w.kind==='book'){body.sanityBooking=clone(w.booking);body.values=clone(w.booking.values||{});}else{body.values={};delete body.sanityBooking;for(const s of body.sections){delete s.choiceUserSelected;if(s.selected)s.selected.values={};}}stopBookingAutoLoad();draft={kind:w.kind,title:p.title.trim(),body};dirty=true;automaticWizard=null;closeModal();view=w.kind==='book'?'books':'templates';shell();if(w.kind==='book')await autoFillBookingDocuments();else toast('Sjabloonvoorstel klaar. Pas aan en klik op Opslaan.');}finally{button.disabled=false;}});}

</script></html>
