<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Uw persoonlijke reis · Treinrondreis</title>
<style>
:root{--ink:#183c3c;--green:#216e60;--paper:#f5f3eb;--line:#dce4dd;--gold:#c38b43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:var(--green)}button,input,.button{font:inherit}button,.button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 17px;background:white;color:var(--ink);text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--green)}button:disabled{opacity:.6;cursor:wait}.primary{background:var(--green);color:white;border-color:var(--green)}header{padding:18px max(20px,calc((100% - 1080px)/2));background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}header b{font-size:14px;letter-spacing:2px}header small{display:block;color:#cbded5;font-size:12px}header button{background:transparent;color:white;border-color:#6e8e84;padding:6px 12px;font-size:13px}main{max-width:1080px;margin:auto;padding:38px 22px 60px}.login{max-width:440px;margin:45px auto;background:white;border:1px solid var(--line);padding:30px;border-radius:20px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:2px;color:var(--green)}h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:10px 0 20px}h2{line-height:1.3;margin:0 0 10px;font-size:23px}.login input{display:block;width:100%;padding:13px;border:1px solid #95afa3;border-radius:10px;margin:8px 0 16px;text-transform:uppercase;letter-spacing:3px}.hero{display:grid;grid-template-columns:1fr 220px;gap:36px;align-items:center;margin-bottom:30px}.hero img{width:100%;max-height:250px;object-fit:contain;filter:drop-shadow(0 9px 12px #0002);border-radius:7px}.hero p{max-width:600px}.muted{color:#60766c;font-size:13px}.notice{padding:14px;border-radius:12px;background:#fff0d9}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters button{padding:8px 13px;font-size:14px}.filters button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.toolbar{border-top:1px solid var(--line);padding-top:20px;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}.card .tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--green)}.card .dates{font-size:13px;color:#60766c;margin:8px 0 16px}.card details{margin:16px 0}.card summary{cursor:pointer;font-weight:600}.text{white-space:pre-line;overflow-wrap:anywhere;font-size:15px;margin-top:16px;line-height:1.75}.gallery{display:grid;gap:12px;margin:16px 0}.gallery figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.gallery a{display:block;text-decoration:none}.gallery img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain;background:var(--paper)}.gallery figcaption{font-size:11px;color:#60766c;padding:6px 10px}.card .button{margin-top:14px}.empty{padding:25px;background:white;border-radius:14px}.footer{border-top:1px solid var(--line);margin-top:35px;padding-top:18px;font-size:12px;color:#60766c}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:650px){main{padding:25px 16px 40px}.hero{grid-template-columns:1fr;gap:20px}.hero img{display:none}.grid{grid-template-columns:1fr}.card{padding:21px}.login{margin:20px auto;padding:24px}header{padding:14px 16px}.filters{gap:6px}.filters button{font-size:13px}}
</style></head><body><header><div><b>TREINRONDREIS</b><small>Uw persoonlijke reiswebsite</small></div><button id="logout" hidden>Afsluiten</button></header><main id="app"><p role="status">Uw reiswebsite wordt geladen…</p></main>
<script>
const base=location.pathname.replace(/\/$/,''),app=document.querySelector('#app');let data,day='',kind='';const kinds={tickets:'Tickets',hotels:'Hotels & vouchers',routes:'Routes',informatie:'Reisinformatie'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function dateText(value){const d=new Date(value+'T12:00:00');return Number.isFinite(d.getTime())?d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):value}
function link(text,path,primary=false){const n=el('a',text,primary?'button primary':'button');n.href=base+'/'+path;n.target='_blank';n.rel='noopener noreferrer';return n}
async function request(action,body){const r=await fetch(base+'/'+action,{cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Travel-Site':'1'},body:JSON.stringify(body)})});let value;try{value=await r.json()}catch{value={error:'De reiswebsite is tijdelijk niet bereikbaar.'}}return {status:r.status,value}}
function login(message=''){document.querySelector('#logout').hidden=true;app.replaceChildren();const box=el('section',undefined,'login');box.append(el('span','Uw reis begint hier','eyebrow'),el('h1','Welkom op uw reiswebsite'),el('p','Vul de toegangscode in die u bij uw persoonlijke link heeft ontvangen.'));const form=el('form'),label=el('label','Toegangscode'),input=el('input');input.name='code';input.id='code';input.autocomplete='off';input.autocapitalize='characters';input.spellcheck=false;input.required=true;input.maxLength=24;label.htmlFor='code';const button=el('button','Open mijn reis','primary');button.type='submit';const status=el('p',message,'notice');status.hidden=!message;status.setAttribute('role','status');form.append(label,input,button,status);box.append(form);app.append(box);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const r=await request('login',{code:input.value});if(r.status!==200){status.textContent=r.value.error;status.hidden=false;return;}await load()}catch{status.textContent='Er is geen verbinding. Probeer het opnieuw.';status.hidden=false}finally{button.disabled=false}})}
function filterButton(text,value,field){const b=el('button',text);b.type='button';b.setAttribute('aria-pressed',String((field==='day'?day:kind)===value));b.addEventListener('click',()=>{if(field==='day')day=value;else kind=value;render()});return b}
function appendImages(card,chapter,index){const images=(chapter.images||[]).filter(image=>Number.isInteger(image.index)&&image.index>=0&&image.index<12);if(!images.length)return;const gallery=el('div',undefined,'gallery');for(const image of images){const figure=el('figure'),a=el('a'),img=el('img'),caption=el('figcaption','Afbeelding uit uw reisboekje');const url=base+'/image/'+index+'/'+image.index;a.href=url;a.target='_blank';a.rel='noopener noreferrer';img.src=url;img.alt='Afbeelding bij '+chapter.title;img.loading='lazy';img.decoding='async';let attempts=0;img.addEventListener('error',()=>{if(attempts++<2)setTimeout(()=>img.src=url,attempts*800);else{img.hidden=true;a.href=base+'/chapter/'+index;caption.textContent='Bekijk de afbeelding in het PDF-hoofdstuk.'}});a.append(img,caption);figure.append(a);gallery.append(figure)}card.append(gallery)}

function render(){app.replaceChildren();document.title=data.title+' · Treinrondreis';document.querySelector('#logout').hidden=false;const hero=el('section',undefined,'hero'),intro=el('div');intro.append(el('span','Alles voor onderweg','eyebrow'),el('h1',data.title),el('p','Uw reisdocumenten en praktische informatie op één plek. Download het complete reisboekje om het ook zonder internet bij de hand te hebben.'),link('Download mijn reisboekje','book',true),el('p','Deze website hoort bij de PDF-versie van '+new Date(data.created).toLocaleString('nl-NL')+'.','muted'));const cover=el('img');cover.src=base+'/cover';cover.alt='Omslag van uw reisboekje';cover.addEventListener('error',()=>cover.hidden=true);hero.append(intro,cover);app.append(hero);const toolbar=el('nav',undefined,'toolbar');toolbar.setAttribute('aria-label','Reisinformatie filteren');const categories=el('div',undefined,'filters');categories.append(filterButton('Alles','','kind'));for(const [key,label] of Object.entries(kinds))if(data.chapters.some(c=>c.kind===key))categories.append(filterButton(label,key,'kind'));toolbar.append(categories);const dates=[...new Set(data.chapters.flatMap(c=>c.dates||[]))].sort();if(dates.length){const days=el('div',undefined,'filters');days.append(filterButton('Alle reisdagen','','day'));for(const d of dates)days.append(filterButton(dateText(d),d,'day'));toolbar.append(days)}app.append(toolbar);const grid=el('div',undefined,'grid');for(const [i,c] of data.chapters.entries()){if(kind&&kind!==c.kind||day&&c.dates.length&&!c.dates.includes(day))continue;const card=el('article',undefined,'card');card.append(el('span',kinds[c.kind]||'Reisinformatie','tag'),el('h2',c.title));if(c.dates.length)card.append(el('p',c.dates.map(dateText).join(' · '),'dates'));appendImages(card,c,i);if(c.kind==='tickets')card.append(el('p','Open de PDF om uw tickets en originele barcodes te bekijken. Een hoofdstuk kan meerdere trajecten bevatten.'));else if(c.text.trim()){const detail=el('details'),summary=el('summary','Lees de informatie'),text=el('div',c.text,'text');detail.append(summary,text);if(c.text.length<1800)detail.open=true;card.append(detail)}else card.append(el('p','De informatie staat in de oorspronkelijke PDF.'));card.append(link(c.kind==='tickets'?'Open tickets (PDF)':c.kind==='hotels'?'Open voucherhoofdstuk (PDF)':'Open hoofdstuk (PDF)','chapter/'+i));grid.append(card)}if(!grid.children.length)grid.append(el('p','Geen onderdelen bij deze selectie. Kies een andere categorie of reisdag.','empty'));app.append(grid,el('p','Bewaar uw reisdocumenten ook op uw telefoon. Deze website toont de opgeslagen boekjesversie; wijzigingen worden niet automatisch uit uw reservering overgenomen.','footer'))}
async function load(){try{const r=await request('data');if(r.status===401){login();return}if(r.status!==200){app.replaceChildren(el('p',r.value.error||'Deze reiswebsite is niet beschikbaar.','notice'));return}data=r.value;render()}catch{app.replaceChildren(el('p','De reiswebsite is tijdelijk niet bereikbaar. Controleer uw verbinding.','notice'))}}
document.querySelector('#logout').addEventListener('click',async()=>{let message='';try{const r=await request('logout',{});if(r.status!==200)throw Error()}catch{message='Afsluiten kon niet worden bevestigd. Sluit dit browservenster als u een gedeeld apparaat gebruikt.'}finally{data=null;day='';kind='';document.title='Uw persoonlijke reis · Treinrondreis';login(message)}});load();
</script></body></html>
