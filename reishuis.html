<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reishuis 0.3 · Seinhuis</title><link rel="stylesheet" href="/seinhuis/reishuis/reishuis.css"><script type="module" src="/seinhuis/reishuis/reishuis.js"></script></head>
<body><header><a href="/seinhuis/">← Seinhuis</a><strong>Reishuis <small>0.3</small></strong><span id="signed-user" aria-live="polite"></span></header>
<nav class="app-nav" aria-label="Reishuis"><a href="/seinhuis/">← Seinhuis</a><label>Weergave <select id="layout"><option value="dashboard">Dashboard</option><option value="workspace">Boekingenwerkplek</option></select></label><button id="hotels">Hotels</button><button id="refresh">Vernieuwen</button><button id="activity">Activiteit</button></nav>
<main><div class="intro"><div><p class="eyebrow">ELKE REIS BEGINT HIER</p><h1>Wat zoek je vandaag?</h1><p>Je boekingen, klanten en hotelinformatie op één plek.</p></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Zoek boekingsnummer of klantnaam…" aria-label="Zoek boekingsnummer of klantnaam"><label>Boekingsstatus <select id="status-filter"><option value="dashboard">Mijn vijf rijen</option></select></label><label>Betaling <select id="payment-filter"><option value="">Alle betalingen</option><option value="no-link">Zonder betaallink</option><option value="overdue">Te laat met betaling</option><option value="paid">Volledig betaald</option><option value="partial">Deels betaald</option><option value="unpaid">Niet betaald</option><option value="none">Geen betaalverzoek</option><option value="unknown">Betaling controleren</option></select></label><button id="settings">Rijen instellen</button><button id="customers">Klanten</button></div>
<p id="message" role="status" aria-live="polite">Boekingen laden…</p><p id="rinkel-state" class="footnote" hidden></p><section id="incoming-call" hidden></section><div id="rows"></div>
<section id="customer-panel" hidden><div class="section-head"><h2>Klanten</h2><button id="close-customers">Sluiten</button></div><form id="new-customer"><label>Nieuwe klant <input name="name" required maxlength="160" placeholder="Naam"></label><label><input name="duplicate" type="checkbox"> Ik heb gelijknamige klanten gecontroleerd en wil een aparte klant maken</label><button>Klant toevoegen</button></form><input id="customer-search" type="search" aria-label="Zoek klanten" placeholder="Zoek een klant…"><div id="customer-list"></div></section>
<dialog id="detail"><div class="section-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="Sluiten">Sluiten</button></div><div id="detail-body"></div></dialog>
<dialog id="preferences"><h2>Vijf rijen instellen</h2><form id="row-form"><div id="row-fields"></div><div class="actions"><button>Instellingen opslaan</button><button type="button" id="cancel-settings">Annuleren</button></div></form></dialog>
<p class="footnote" id="synced"></p></main></body></html>
